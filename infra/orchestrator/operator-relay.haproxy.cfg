global
    maxconn 32

defaults
    mode http
    timeout connect 2s
    timeout client 5s
    timeout server 5s

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold valid 10s
    hold obsolete 10s

frontend health_in
    bind :8080
    acl method_get method GET
    acl health_path path /healthz /readyz
    http-request deny deny_status 405 unless method_get
    http-request deny deny_status 404 unless health_path
    default_backend health_out

backend health_out
    server orchestrator orchestrator:8080 check inter 2s resolvers docker resolve-prefer ipv4 init-addr libc,none

frontend state_in
    bind :8081
    acl method_get method GET
    acl state_path path /metrics /state/snapshot
    http-request deny deny_status 405 unless method_get
    http-request deny deny_status 404 unless state_path
    default_backend state_out

backend state_out
    server orchestrator orchestrator:8081 check inter 2s resolvers docker resolve-prefer ipv4 init-addr libc,none
