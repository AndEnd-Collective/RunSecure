apiVersion: runsecure.io/v1alpha1

# A descriptive name; appears in container names, log events, /state/snapshot.
name: example-scope
description: "Template scope. Copy this to <yourname>.yml and edit."

# Host-wide ceiling across all repos in this scope.
global_max_runners: 5

# Poll cadence (seconds). Minimum 5.
poll_interval_seconds: 15

# strict | standard | permissive | custom.
# strict denies wildcards/DoH/IMDS/kube-api by default. User-explicit
# entries in runner.yml security_overrides always win (see
# allow_project_overrides).
security_profile: strict

# Which knobs a project's runner.yml is allowed to override. Anything not
# listed here is silently ignored if a project sets it.
allow_project_overrides:
  - allow_wildcards

# Two credential types are supported. The Compose wrapper reads auth.type
# from this file and initializes only the matching secret, so a github_app
# scope does not need a PAT and a pat scope does not need a private key.
#
# auth.type: pat — set RUNSECURE_PAT_FILE in the scope .env to the host PAT
# (regular file, owned by you, mode 0400).
auth:
  type: pat
  pat_file: /run/secrets/runsecure-pat

# auth.type: github_app — set RUNSECURE_APP_PRIVATE_KEY_FILE in the scope .env
# to the host PEM (regular file, owned by you, mode 0400). The orchestrator
# mints and refreshes installation tokens from it; no PAT is involved.
#
# auth:
#   type: github_app
#   app_id: 123456
#   installation_id: 7890123
#   private_key_file: /run/secrets/runsecure-app-private-key

orch_egress:
  allow_domains:
    - api.github.com

repos:
  - repo: owner/repo
    project_dir: /projects/repo
    max_concurrent: 3
