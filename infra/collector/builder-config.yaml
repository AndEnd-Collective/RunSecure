# Public assembly recipe only. Private Cornerstone source is supplied separately.
# Upstream 490fc072 requires Collector core 1.64 / contrib 0.158; using its
# older 0.150 builder example would silently mix incompatible release lines.
dist:
  module: runsecure/collector/distribution
  name: runsecure-collector
  description: RunSecure archival collector with privately supplied Cornerstone processors
  output_path: ./dist
  otelcol_version: 0.158.0
  version: 0.1.0
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.158.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.158.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.158.0
  - gomod: runsecure/collector/processor v0.0.0
    import: runsecure/collector/processor/runsecureprocessor
    path: ./public-processor
  - gomod: cornerstone/otel-collector v0.0.0
    import: cornerstone/otel-collector/processor/cornerstoneenricherprocessor
    path: ./cornerstone-src/otel-collector
  - gomod: cornerstone/otel-collector v0.0.0
    import: cornerstone/otel-collector/processor/cornerstoneschemaprocessor
    path: ./cornerstone-src/otel-collector
  - gomod: cornerstone/otel-collector v0.0.0
    import: cornerstone/otel-collector/processor/cornerstonevalidatorprocessor
    path: ./cornerstone-src/otel-collector
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.158.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/awscloudwatchlogsexporter v0.158.0
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.158.0
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.64.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.64.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.64.0
# Security floors from the image's 2026-10-29 Grype report. Keep the Collector
# release line fixed while updating affected transitive libraries explicitly.
# No vulnerability is suppressed: rebuild, validate and rescan each update.
replaces:
  - golang.org/x/net => golang.org/x/net v0.62.0
  - golang.org/x/crypto => golang.org/x/crypto v0.58.0
  - golang.org/x/text => golang.org/x/text v0.43.0
  - google.golang.org/grpc => google.golang.org/grpc v1.83.2
  - go.opentelemetry.io/otel => go.opentelemetry.io/otel v1.45.0
  - go.opentelemetry.io/otel/metric => go.opentelemetry.io/otel/metric v1.45.0
  - go.opentelemetry.io/otel/trace => go.opentelemetry.io/otel/trace v1.45.0
  - go.opentelemetry.io/otel/sdk => go.opentelemetry.io/otel/sdk v1.45.0
  - go.opentelemetry.io/otel/sdk/metric => go.opentelemetry.io/otel/sdk/metric v1.45.0
  # sdk/log and OTLP log exporters remain on the Collector's 0.20 API line:
  # 0.21 removes API symbols used by 0.158's bridge/exporters. Their Medium
  # advisories remain in the unfiltered report; do not suppress them.
  - go.opentelemetry.io/otel/exporters/otlp/otlptrace => go.opentelemetry.io/otel/exporters/otlp/otlptrace v1.45.0
  - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc => go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc v1.45.0
  - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp => go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp v1.45.0
