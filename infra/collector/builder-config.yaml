# Public assembly recipe only. Private Cornerstone source is supplied separately.
# Qualify the pinned Cornerstone processors on the currently supported line.
# Official 0.164.0 distribution manifests select contrib 0.164.1/core 1.70.0.
# Keep this coherent graph; do not force older transitive SDK versions.
dist:
  module: runsecure/collector/distribution
  name: runsecure-collector
  description: RunSecure archival collector with privately supplied Cornerstone processors
  output_path: ./dist
  otelcol_version: 0.164.0
  version: 0.1.0
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.164.1
processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.164.1
  - gomod: runsecure/collector/processor v0.0.0
    import: runsecure/collector/processor/runsecureprocessor
    path: ./public-processor
  - gomod: cornerstone/otel-collector v0.0.0
    import: cornerstone/otel-collector/processor/cornerstoneenricherprocessor
    path: ./cornerstone-src/otel-collector
  - gomod: cornerstone/otel-collector v0.0.0
    import: cornerstone/otel-collector/processor/cornerstoneschemaprocessor
    path: ./cornerstone-src/otel-collector
  - gomod: cornerstone/otel-collector v0.0.0
    import: cornerstone/otel-collector/processor/cornerstonevalidatorprocessor
    path: ./cornerstone-src/otel-collector
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/awscloudwatchlogsexporter v0.164.1
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.70.0
# GO-2026-6860/6866 are fixed in x/net 0.62.0. Keep this narrow security
# floor while leaving the supported Collector/SDK graph coherent. Rebuild,
# qualify the real private processors and rescan; no advisory is suppressed.
replaces:
  - golang.org/x/net => golang.org/x/net v0.62.0
