# ============================================================================
# RunSecure — Grype Configuration
# ============================================================================
# Allowlist for vulnerabilities that we cannot fix directly because the
# affected component is vendored inside an upstream release we pin.
#
# The list is currently EMPTY, and that is the goal state. Every published
# image — base, node 22/24, python 3.12, rust stable, proxy, orchestrator and
# socket-proxy — passes `grype --fail-on high --only-fixed` with no
# suppressions at all, verified by building each image on linux/arm64 and
# running infra/scripts/grype-scan-image.sh against it.
#
# Ten entries were removed once the pins they were blocked on moved:
#   - GO-2026-4610 (docker/cli vendored in gh) and GO-2026-4970 /
#     CVE-2026-39822 (go stdlib "os" symlink escape). gh 2.102.0 is built with
#     go1.27.1 and vendors docker/cli 29.7.2, and Grype no longer reports
#     either against the base image.
#   - eight CPython findings (CVE-2026-7210, -4224, -3644, -6100, -9669,
#     -15308, -3298, -4786). These were justified on "3.12.13 is the latest
#     3.12, there is nothing to upgrade to". 3.12.14 and 3.12.15 shipped;
#     images/python.Dockerfile installs 3.12.15 and none of the eight is
#     reported any more.
#
# Prefer fixing over ignoring. Two npm-bundled packages (undici,
# brace-expansion) ship behind their security fixes in every current npm
# release; rather than suppress those advisories, images/base.Dockerfile and
# images/node.Dockerfile overwrite them with checksum-pinned patched versions.
# tests/validation/test-npm-payload-refresh.sh fails if those advisory IDs ever
# appear in this file.
#
# Every entry MUST include:
#   - the upstream that ships the vendored dep
#   - the pin in our code that controls the version
#   - the rationale for accepting the finding (what's the realistic blast
#     radius given how the runner uses the affected code path)
#   - a re-evaluation trigger
#
# Process for adding a new entry:
#   1. Confirm there's no upstream fix (we already pin past the fixed
#      version of our DIRECT deps). If a fix exists, take the fix.
#   2. Reachability: confirm the vulnerable code path's reachability and
#      impact in our threat model. RunSecure's runner is designed to execute
#      untrusted workflow code; CVEs in libraries the runner uses to run that
#      workflow are not exploit avenues that CHANGE the threat model.
#   3. Record the upstream tracking issue and the pin we update to clear it
#      (e.g. RUNNER_VERSION, GH_CLI_VERSION, PYTHON_VERSION in images/).
#   4. Re-evaluate on the next bump of that pin and delete the entry when it
#      stops being reported — a stale ignore silently suppresses a real
#      finding, which is exactly how the ten entries above outlived their
#      justifications.
# ============================================================================

ignore: []
