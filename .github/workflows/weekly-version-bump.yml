# ============================================================================
# RunSecure — Weekly Patch-Version Bump
# ============================================================================
# Every Monday 02:30 UTC, computes the next patch version (latest tag +1
# on the patch component), creates an annotated tag, and pushes it. The
# tag push fires publish-images.yml in publish mode, which rebuilds every
# image (no-cache so Debian package updates land), runs the post-publish
# Grype scan, and pushes the new tag to GHCR.
#
# Why nominal weekly bumps:
#   - Consumers can pin `version: 1.4.7` in runner.yml against a specific
#     week's image set with known hardening + dependency state.
#   - The base image picks up Debian package security updates implicitly
#     because the rebuild uses `no-cache: true`. The scanner gates the
#     publish — if a HIGH/CRITICAL CVE with a fix slips in, the workflow
#     fails and the tag stays around but the GHCR images aren't updated
#     to that tag.
#
# Manual override:
#   - workflow_dispatch with `bump_type: minor|major` for non-patch bumps.
#   - workflow_dispatch with `dry_run: true` to compute the next version
#     without creating a tag (for sanity-checking).
#
# Initial state:
#   - If no v*.*.* tag exists yet, starts from v0.0.0 and produces v0.0.1.
# ============================================================================

name: weekly-version-bump

on:
  schedule:
    # Monday 02:30 UTC — 30 min before the previous publish-images schedule
    # so the resulting tag-push fires before any external consumers expect
    # the new images to be available.
    - cron: '30 2 * * 1'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Compute next version without tagging'
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # Every Go module the weekly refresh covers, not just the two shipped
  # binaries. tools/corner-lint and the compose mock-github server were
  # excluded for months and drifted several minor versions behind; then
  # infra/telemetry and the collector admission tests were added to the repo
  # and missed the same way (the admission tests sat on a cel-go release with
  # a published advisory, GO-2026-6094, while this job reported nothing to
  # refresh).
  # infra/collector/processor is deliberately absent. Its
  # go.opentelemetry.io/collector/* versions must match the OCB release pinned
  # in infra/collector/Dockerfile and build.sh, which builds with
  # --skip-strict-versioning=false; `go get -u` would move them out of step
  # and break the collector image. Bump it together with OCB.
  GO_MODULES: >-
    infra/orchestrator
    infra/socket-proxy
    infra/telemetry
    infra/collector/tests/admission
    tools/corner-lint
    tests/integration/orchestrator/compose/mock-github

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      # Required to push the new tag back to the repo. No write access
      # to any other ref — branch protection on main is unaffected.
      contents: write
    outputs:
      version: ${{ steps.next_version.outputs.version }}
    steps:
      - name: Require the release cascade token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is required; GITHUB_TOKEN tag pushes do not start the release cascade"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history + tags to find the latest semver tag.
          fetch-depth: 0
          fetch-tags: true
          # Use a PAT (or GitHub App token) so the resulting tag-push
          # fires downstream workflows (publish-images.yml). Tags pushed
          # via the default GITHUB_TOKEN are deliberately suppressed by
          # GitHub to prevent recursion — which silently breaks our
          # bump → publish → acceptance → promote cascade.
          # Failing closed is essential: GITHUB_TOKEN can push a tag, but
          # GitHub suppresses the downstream publish workflow for that push.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute next version
        id: next_version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type || 'patch' }}
        run: |
          set -euo pipefail
          # Find latest v<MAJ>.<MIN>.<PATCH> tag. Sort by version, descending.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No prior semver tag found — starting from v0.0.0"
          else
            echo "Latest tag: $LATEST"
          fi

          MAJOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\.[0-9]+\.[0-9]+$/\1/')
          MINOR=$(echo "$LATEST" | sed -E 's/^v[0-9]+\.([0-9]+)\.[0-9]+$/\1/')
          PATCH=$(echo "$LATEST" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Invalid bump type: $BUMP_TYPE" >&2; exit 1 ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $NEXT (bump: $BUMP_TYPE)"

      - name: Create and push tag
        if: github.event.inputs.dry_run != 'true'
        env:
          NEXT_VERSION: ${{ steps.next_version.outputs.version }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type || 'patch' }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$IS_SCHEDULED" = "true" ]; then
            REASON="Weekly automated ${BUMP_TYPE} release"
          else
            REASON="Manual ${BUMP_TYPE} release"
          fi

          # Build the tag message in a temp file so the multi-line body
          # doesn't have to live inside the YAML `run: |` literal block
          # (where column-0 continuations would terminate the scope).
          TAGMSG=$(mktemp)
          {
            printf '%s\n\n' "$REASON"
            printf 'This tag was created automatically by the weekly-version-bump workflow.\n'
            printf 'The publish-images workflow will fire on this tag-push and rebuild +\n'
            printf 'scan + publish all images at this version to GHCR.\n'
          } > "$TAGMSG"

          git tag -a "$NEXT_VERSION" -F "$TAGMSG"
          rm -f "$TAGMSG"
          git push origin "$NEXT_VERSION"
          echo "Pushed tag: $NEXT_VERSION"

      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        env:
          NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          echo "DRY RUN — would tag $NEXT_VERSION but did not."
          echo "$NEXT_VERSION" > "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Refresh Go module dependencies weekly so they never go stale between
  # releases. Without this, a freshly-published CVE in a transitive dep
  # (e.g. golang.org/x/net pulled by client-go) only surfaces at the
  # post-publish Grype gate and blocks the release. The refresh lands as a PR
  # that is gated by CI (including the per-image Grype scans) and merged
  # before the next bump, keeping the released binaries current.
  #
  # It is split across two jobs on purpose. `go get -u` pulls the newest
  # release of every dependency, and `go build` / `go test` then execute that
  # code (init functions, test binaries, cgo build steps). That must never
  # happen in a job that holds a credential:
  #
  #   go-deps-build  runs the Go toolchain. Read-only token, checkout does not
  #                  persist it, no secret is referenced. Its only output is a
  #                  patch of go.mod / go.sum.
  #   go-deps-pr     holds RELEASE_TOKEN. It never runs Go or anything from
  #                  the refreshed modules: it checks that the patch touches
  #                  nothing but go.mod / go.sum of the listed modules,
  #                  applies it and opens the PR.
  #   go-deps-merge  holds RELEASE_TOKEN. Runs one repo script that waits for
  #                  the PR's checks and merges it when all of them passed.
  #
  # The PR is pushed and opened with RELEASE_TOKEN, not GITHUB_TOKEN, on
  # purpose: a pull request opened by GITHUB_TOKEN has its workflow runs held
  # for manual approval, which left every weekly refresh waiting on a person.
  # With the PAT the checks start on their own, and go-deps-merge lands the
  # refresh once they are green. No step of the release train waits for a
  # human; CI is the gate.
  # --------------------------------------------------------------------------
  go-deps-build:
    needs: bump
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Refresh, build and test Go modules
        id: refresh
        run: |
          set -euo pipefail
          read -r -a MODULES <<< "$GO_MODULES"
          # k8s.io/kube-openapi publishes no semver tags, so `go get -u` always
          # walks it to the newest pseudo-version — which is routinely ahead of
          # the k8s.io/{api,apimachinery,client-go} release the module pins.
          # The two then disagree on which major of
          # sigs.k8s.io/structured-merge-diff to use, and the module resolves
          # but does not compile:
          #   apimachinery/pkg/util/managedfields/internal/typeconverter.go:51:
          #   cannot use typeSchema.Types (…/structured-merge-diff/v7/schema) as
          #   […]/structured-merge-diff/v6/schema value in struct literal
          # Re-pin it to exactly the revision the k8s release asks for, read out
          # of apimachinery's own go.mod rather than hardcoded here so it
          # follows future k8s bumps on its own.
          # Advisory, not authoritative: if the required revision cannot be
          # determined this warns and moves on, because the build+vet+test loop
          # below is what actually gates the PR. Failing hard here would also
          # break tests/validation/test-release-allowlist.sh, which executes
          # this very step with stubbed go/git/gh to prove the PR-policy
          # exception is narrow — under those stubs `go list` returns nothing.
          repin_kube_openapi() {
            grep -q 'k8s.io/kube-openapi' go.mod || return 0
            local am_mod want
            am_mod=$(go list -m -f '{{.GoMod}}' k8s.io/apimachinery 2>/dev/null) || return 0
            [ -n "$am_mod" ] && [ -f "$am_mod" ] || {
              echo "::warning::could not locate k8s.io/apimachinery go.mod; leaving kube-openapi as resolved"
              return 0
            }
            want=$(awk '$1=="k8s.io/kube-openapi"{print $2; exit}' "$am_mod")
            if [ -z "$want" ]; then
              echo "::warning::k8s.io/apimachinery does not require kube-openapi; leaving it as resolved"
              return 0
            fi
            echo "re-pinning k8s.io/kube-openapi to ${want} (required by apimachinery)"
            go get "k8s.io/kube-openapi@${want}"
            go mod tidy
          }

          for mod in "${MODULES[@]}"; do
            # -t so test-only direct deps (testify) are upgraded too; without
            # it `go get -u ./...` silently leaves them pinned.
            ( cd "$mod" && go get -u -t ./... && go mod tidy && repin_kube_openapi )
          done
          # Build, vet and test every module so the bot can never open a PR
          # that does not compile, whatever else `go get -u` decided to move.
          for mod in "${MODULES[@]}"; do
            ( cd "$mod" && go build ./... && go vet ./... && go test ./... )
          done
          GOFILES=()
          for mod in "${MODULES[@]}"; do
            GOFILES+=("$mod/go.mod")
            [ -f "$mod/go.sum" ] && GOFILES+=("$mod/go.sum")
          done
          # intent-to-add so a go.sum that did not exist before shows up in
          # the diff as a new file.
          git add --intent-to-add -- "${GOFILES[@]}"
          if git diff --quiet -- "${GOFILES[@]}"; then
            echo "no Go dependency changes; skipping PR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff -- "${GOFILES[@]}" > "${RUNNER_TEMP}/go-deps.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload dependency patch
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-deps-patch
          path: ${{ runner.temp }}/go-deps.patch
          if-no-files-found: error
          retention-days: 7

  go-deps-pr:
    needs: [bump, go-deps-build]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      # Branch pushes and the PR itself go through RELEASE_TOKEN. The job
      # token only reads: the checkout, and the open-PR lookup when pruning.
      contents: read
      pull-requests: read
    outputs:
      pr_url: ${{ steps.open-pr.outputs.pr_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download dependency patch
        if: needs.go-deps-build.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-deps-patch
          path: ${{ runner.temp }}/go-deps

      - name: Open the Go dependency refresh PR
        id: open-pr
        if: needs.go-deps-build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT_VERSION: ${{ needs.bump.outputs.version }}
          GO_DEPS_PATCH: ${{ runner.temp }}/go-deps/go-deps.patch
        run: |
          set -euo pipefail
          read -r -a MODULES <<< "$GO_MODULES"
          if [ ! -s "$GO_DEPS_PATCH" ]; then
            echo "::error title=Go dependency patch missing::go-deps-build reported changes but ${GO_DEPS_PATCH} is empty or absent."
            exit 1
          fi
          # The patch was produced by a job that executed third-party code, so
          # it is untrusted input here. It may only change go.mod / go.sum of
          # the listed modules, as regular files: no other path, no rename,
          # no delete, no mode change, no symlink.
          ALLOWED=()
          for mod in "${MODULES[@]}"; do
            ALLOWED+=("$mod/go.mod" "$mod/go.sum")
          done
          while IFS=$'\t' read -r _added _deleted path; do
            [ -n "$path" ] || continue
            permitted=false
            for allowed in "${ALLOWED[@]}"; do
              if [ "$path" = "$allowed" ]; then
                permitted=true
                break
              fi
            done
            if [ "$permitted" != true ]; then
              echo "::error title=Go dependency patch rejected::patch touches ${path}, which is not a go.mod or go.sum of a refreshed module."
              exit 1
            fi
          done < <(git apply --numstat "$GO_DEPS_PATCH")
          if grep -E '^(old mode|new mode|deleted file mode|rename from|rename to|copy from|copy to|similarity index|GIT binary patch) ' "$GO_DEPS_PATCH" \
             || grep -E '^new file mode ' "$GO_DEPS_PATCH" | grep -v -x 'new file mode 100644'; then
            echo "::error title=Go dependency patch rejected::patch changes a file mode, renames, deletes or adds a non-regular file."
            exit 1
          fi
          git apply --index "$GO_DEPS_PATCH"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="bot/go-deps-${NEXT_VERSION}"
          git commit -m "chore(deps): weekly go get -u for $NEXT_VERSION"
          git push origin "HEAD:refs/heads/${BRANCH}"
          if PR_OUTPUT=$(gh pr create \
            --title "chore(deps): weekly Go dependency refresh for $NEXT_VERSION" \
            --body "Automated 'go get -u -t ./...' followed by 'go mod tidy' on six Go modules (orchestrator, socket-proxy, telemetry, collector admission tests, corner-lint, compose mock-github) so dependencies never go stale between releases. A separate credential-free job ran build + vet + test on every module, so this PR compiles; CI — including the per-image Grype scans — gates it as well." \
            --base main --head "$BRANCH" 2>&1); then
            printf '%s\n' "$PR_OUTPUT"
            # gh prints the new pull request's URL as its last line.
            echo "pr_url=$(tail -n 1 <<<"$PR_OUTPUT")" >> "$GITHUB_OUTPUT"
            exit 0
          else
            PR_STATUS=$?
          fi

          printf '%s\n' "$PR_OUTPUT" >&2
          POLICY_ERROR='GitHub Actions is not permitted to create or approve pull requests'
          if [[ "$PR_OUTPUT" == *"$POLICY_ERROR"* ]]; then
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
            echo "::warning title=Go dependency PR requires operator action::Repository policy blocked PR creation. The dependency refresh remains on ${BRANCH}; open ${PR_URL}."
            {
              printf '### Go dependency refresh requires operator action\n\n'
              printf -- "- Branch: \`%s\`\n" "$BRANCH"
              printf -- '- Open the PR: %s\n' "$PR_URL"
              printf -- '- Cause: repository policy blocks GitHub Actions from creating pull requests.\n\n'
              printf 'The release tag and image cascade remain valid. Review and merge this dependency refresh before the next release.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Go dependency PR creation failed::The dependency refresh remains on ${BRANCH}; gh exited with status ${PR_STATUS}."
          exit "$PR_STATUS"

      # Each refresh starts from main, so older bot/go-deps-* branches are
      # superseded by this one. Without pruning they accumulated for months.
      # Branches with an open PR are left for a reviewer to close.
      - name: Prune superseded dependency branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ needs.bump.outputs.version }}
        run: bash infra/scripts/prune-bot-branches.sh bot/go-deps- "bot/go-deps-${NEXT_VERSION}"

  # Land the refresh without a human: wait for every check on the PR and merge
  # it when they are all green. A failed or missing check leaves it open.
  go-deps-merge:
    needs: go-deps-pr
    if: needs.go-deps-pr.outputs.pr_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Merge the refresh once its checks pass
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_URL: ${{ needs.go-deps-pr.outputs.pr_url }}
        # validate.yml always runs and reports four jobs; path-filtered
        # workflows add more. Four is the floor below which "no failures"
        # cannot be told apart from "nothing ran".
        run: bash infra/scripts/merge-pr-when-green.sh "$PR_URL" 4
