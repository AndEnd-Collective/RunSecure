# ============================================================================
# RunSecure — Weekly Patch-Version Bump
# ============================================================================
# Every Monday 02:30 UTC, computes the next patch version (latest tag +1
# on the patch component), creates an annotated tag, and pushes it. The
# tag push fires publish-images.yml in publish mode, which rebuilds every
# image (no-cache so Debian package updates land), runs the post-publish
# Grype scan, and pushes the new tag to GHCR.
#
# Why nominal weekly bumps:
#   - Consumers can pin `version: 1.4.7` in runner.yml against a specific
#     week's image set with known hardening + dependency state.
#   - The base image picks up Debian package security updates implicitly
#     because the rebuild uses `no-cache: true`. The scanner gates the
#     publish — if a HIGH/CRITICAL CVE with a fix slips in, the workflow
#     fails and the tag stays around but the GHCR images aren't updated
#     to that tag.
#
# Manual override:
#   - workflow_dispatch with `bump_type: minor|major` for non-patch bumps.
#   - workflow_dispatch with `dry_run: true` to compute the next version
#     without creating a tag (for sanity-checking).
#
# Initial state:
#   - If no v*.*.* tag exists yet, starts from v0.0.0 and produces v0.0.1.
# ============================================================================

name: weekly-version-bump

on:
  schedule:
    # Monday 02:30 UTC — 30 min before the previous publish-images schedule
    # so the resulting tag-push fires before any external consumers expect
    # the new images to be available.
    - cron: '30 2 * * 1'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Compute next version without tagging'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      # Required to push the new tag back to the repo. No write access
      # to any other ref — branch protection on main is unaffected.
      contents: write
      pull-requests: write
    steps:
      - name: Require the release cascade token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is required; GITHUB_TOKEN tag pushes do not start the release cascade"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Need full history + tags to find the latest semver tag.
          fetch-depth: 0
          fetch-tags: true
          # Use a PAT (or GitHub App token) so the resulting tag-push
          # fires downstream workflows (publish-images.yml). Tags pushed
          # via the default GITHUB_TOKEN are deliberately suppressed by
          # GitHub to prevent recursion — which silently breaks our
          # bump → publish → acceptance → promote cascade.
          # Failing closed is essential: GITHUB_TOKEN can push a tag, but
          # GitHub suppresses the downstream publish workflow for that push.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute next version
        id: next_version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type || 'patch' }}
        run: |
          set -euo pipefail
          # Find latest v<MAJ>.<MIN>.<PATCH> tag. Sort by version, descending.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No prior semver tag found — starting from v0.0.0"
          else
            echo "Latest tag: $LATEST"
          fi

          MAJOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\.[0-9]+\.[0-9]+$/\1/')
          MINOR=$(echo "$LATEST" | sed -E 's/^v[0-9]+\.([0-9]+)\.[0-9]+$/\1/')
          PATCH=$(echo "$LATEST" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Invalid bump type: $BUMP_TYPE" >&2; exit 1 ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $NEXT (bump: $BUMP_TYPE)"

      - name: Create and push tag
        if: github.event.inputs.dry_run != 'true'
        env:
          NEXT_VERSION: ${{ steps.next_version.outputs.version }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type || 'patch' }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$IS_SCHEDULED" = "true" ]; then
            REASON="Weekly automated ${BUMP_TYPE} release"
          else
            REASON="Manual ${BUMP_TYPE} release"
          fi

          # Build the tag message in a temp file so the multi-line body
          # doesn't have to live inside the YAML `run: |` literal block
          # (where column-0 continuations would terminate the scope).
          TAGMSG=$(mktemp)
          {
            printf '%s\n\n' "$REASON"
            printf 'This tag was created automatically by the weekly-version-bump workflow.\n'
            printf 'The publish-images workflow will fire on this tag-push and rebuild +\n'
            printf 'scan + publish all images at this version to GHCR.\n'
          } > "$TAGMSG"

          git tag -a "$NEXT_VERSION" -F "$TAGMSG"
          rm -f "$TAGMSG"
          git push origin "$NEXT_VERSION"
          echo "Pushed tag: $NEXT_VERSION"

      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        env:
          NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          echo "DRY RUN — would tag $NEXT_VERSION but did not."
          echo "$NEXT_VERSION" > "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Refresh Go module dependencies weekly so they never go stale between
      # releases. Without this, a freshly-published CVE in a transitive dep
      # (e.g. golang.org/x/net pulled by client-go) only surfaces at the
      # post-publish Grype gate and blocks the release. This opens a PR that is
      # gated by CI (including the per-image Grype scans) and merged before the
      # next bump, keeping the released binaries current.
      # ----------------------------------------------------------------------
      - name: Set up Go
        if: github.event.inputs.dry_run != 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Refresh Go module dependencies
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          set -euo pipefail
          for mod in infra/orchestrator infra/socket-proxy; do
            ( cd "$mod" && go get -u ./... && go mod tidy )
          done
          if git diff --quiet -- infra/orchestrator/go.mod infra/orchestrator/go.sum \
                                  infra/socket-proxy/go.mod infra/socket-proxy/go.sum; then
            echo "no Go dependency changes; skipping PR"
            exit 0
          fi
          BRANCH="bot/go-deps-${NEXT_VERSION}"
          git add infra/orchestrator/go.mod infra/orchestrator/go.sum \
                  infra/socket-proxy/go.mod infra/socket-proxy/go.sum
          git commit -m "chore(deps): weekly go get -u for $NEXT_VERSION"
          git push origin "HEAD:refs/heads/${BRANCH}"
          if PR_OUTPUT=$(gh pr create \
            --title "chore(deps): weekly Go dependency refresh for $NEXT_VERSION" \
            --body "Automated 'go get -u ./... && go mod tidy' on both Go modules so dependencies never go stale between releases. CI — including the per-image Grype scans — gates this PR." \
            --base main --head "$BRANCH" 2>&1); then
            printf '%s\n' "$PR_OUTPUT"
            exit 0
          else
            PR_STATUS=$?
          fi

          printf '%s\n' "$PR_OUTPUT" >&2
          POLICY_ERROR='GitHub Actions is not permitted to create or approve pull requests'
          if [[ "$PR_OUTPUT" == *"$POLICY_ERROR"* ]]; then
            PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
            echo "::warning title=Go dependency PR requires operator action::Repository policy blocked PR creation. The dependency refresh remains on ${BRANCH}; open ${PR_URL}."
            {
              printf '### Go dependency refresh requires operator action\n\n'
              printf -- '- Branch: `%s`\n' "$BRANCH"
              printf -- '- Open the PR: %s\n' "$PR_URL"
              printf -- '- Cause: repository policy blocks GitHub Actions from creating pull requests.\n\n'
              printf 'The release tag and image cascade remain valid. Review and merge this dependency refresh before the next release.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Go dependency PR creation failed::The dependency refresh remains on ${BRANCH}; gh exited with status ${PR_STATUS}."
          exit "$PR_STATUS"
