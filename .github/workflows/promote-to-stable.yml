# ============================================================================
# RunSecure — Promote Verified Immutable Manifests to Stable
# ============================================================================
# Manual-only after automatic post-publish acceptance and operator-performed
# live multi-runner acceptance. The exact Publish Images workflow run is an
# explicit input. Its validated release manifest, not a mutable canary tag, is
# the source for every server-side retag.
# ============================================================================

name: promote-to-stable

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Release version to promote (e.g. 2.1.8, without v)'
        required: true
        type: string
      publish_run_id:
        description: 'Successful Publish Images workflow run ID accepted by CI and live verification'
        required: true
        type: string
      acceptance_run_id:
        description: 'Successful post-publish-acceptance run for the exact Publish Images manifest'
        required: true
        type: string

permissions: {}

concurrency:
  # Every release writes the same floating aliases, so versions must not race.
  group: promote-stable
  cancel-in-progress: false

jobs:
  resolve-manifest:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      build_sha: ${{ steps.verify.outputs.build_sha }}
      publish_run_id: ${{ steps.verify.outputs.publish_run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download manifest from the exact Publish Images run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-image-manifest-${{ inputs.image_version }}
          path: .publish-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.publish_run_id }}

      - name: Download manifest proven by the exact acceptance run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-publish-manifest-${{ inputs.publish_run_id }}
          path: .accepted-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.acceptance_run_id }}

      - name: Verify workflow-run and immutable manifest provenance
        id: verify
        env:
          EXPECTED_VERSION: ${{ inputs.image_version }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::image_version must be an exact semver without v"
            exit 1
          fi
          if [[ ! "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::publish_run_id must be a positive integer"
            exit 1
          fi
          if [[ ! "$ACCEPTANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::acceptance_run_id must be a positive integer"
            exit 1
          fi

          gh api "/repos/${REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}" \
            > .publish-manifest/workflow-run.json
          BUILD_SHA=$(python3 - .publish-manifest/workflow-run.json "$EXPECTED_VERSION" <<'PY'
          import json
          import pathlib
          import re
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected_version = sys.argv[2]
          if run.get("name") != "Publish Images":
              raise SystemExit("not a Publish Images workflow run")
          if run.get("path") != ".github/workflows/publish-images.yml":
              raise SystemExit("workflow path does not match publish-images.yml")
          if run.get("event") != "push" or run.get("conclusion") != "success":
              raise SystemExit("Publish Images run must be a successful tag push")
          if run.get("head_branch") != f"v{expected_version}":
              raise SystemExit("Publish Images run is not for the expected release tag")
          build_sha = run.get("head_sha", "")
          if re.fullmatch(r"[0-9a-f]{40,64}", build_sha) is None:
              raise SystemExit("Publish Images run has an invalid head SHA")
          print(build_sha)
          PY
          )

          python3 infra/scripts/verify-release-manifest.py \
            .publish-manifest/release-images.json \
            --expected-release "$EXPECTED_VERSION" \
            --expected-build-sha "$BUILD_SHA" \
            --expected-publish-run-id "$PUBLISH_RUN_ID"

          gh api "/repos/${REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}" \
            > .accepted-manifest/workflow-run.json
          python3 - .accepted-manifest/workflow-run.json <<'PY'
          import json
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if run.get("name") != "post-publish-acceptance":
              raise SystemExit("not a post-publish-acceptance workflow run")
          if run.get("path") != ".github/workflows/post-publish-acceptance.yml":
              raise SystemExit("workflow path does not match post-publish-acceptance.yml")
          if run.get("event") != "workflow_run":
              raise SystemExit("acceptance must be the automatic workflow_run gate")
          if run.get("conclusion") != "success":
              raise SystemExit("post-publish acceptance run did not succeed")
          PY

          python3 infra/scripts/verify-release-manifest.py \
            .accepted-manifest/release-images.json \
            --expected-release "$EXPECTED_VERSION" \
            --expected-build-sha "$BUILD_SHA" \
            --expected-publish-run-id "$PUBLISH_RUN_ID"
          if ! cmp -s .publish-manifest/release-images.json \
              .accepted-manifest/release-images.json; then
            echo "::error::accepted manifest differs from the exact Publish Images manifest"
            exit 1
          fi

          {
            echo "version=$EXPECTED_VERSION"
            echo "build_sha=$BUILD_SHA"
            echo "publish_run_id=$PUBLISH_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve the verified manifest for promotion and release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-image-manifest-${{ inputs.image_version }}
          path: .publish-manifest/release-images.json
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: resolve-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-manifest.outputs.build_sha }}

      - name: Download verified immutable manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-image-manifest-${{ needs.resolve-manifest.outputs.version }}
          path: .verified-manifest

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate preflight, version promotion, and alias barrier
        env:
          BUILD_SHA: ${{ needs.resolve-manifest.outputs.build_sha }}
          VERSION: ${{ needs.resolve-manifest.outputs.version }}
        run: |
          set -euo pipefail
          infra/scripts/verify-remote-release-tag.sh \
            origin "v${VERSION}" "$BUILD_SHA"
          python3 infra/scripts/promote-release-images.py \
            .verified-manifest/release-images.json \
            --release "$VERSION"

  release:
    needs: [resolve-manifest, promote]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      BUILD_SHA: ${{ needs.resolve-manifest.outputs.build_sha }}
      VERSION: ${{ needs.resolve-manifest.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-manifest.outputs.build_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download verified release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-image-manifest-${{ needs.resolve-manifest.outputs.version }}
          path: .verified-manifest

      - name: Prepare durable release asset
        run: |
          cp .verified-manifest/release-images.json \
            "runsecure-v${VERSION}-release-images.json"

      - name: Delete orphan draft and detect an existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          infra/scripts/verify-remote-release-tag.sh \
            origin "v${VERSION}" "$BUILD_SHA"
          if existing=$(gh release view "v${VERSION}" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$existing" = "true" ]; then
              gh release delete "v${VERSION}" --yes
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with auto-generated notes
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          infra/scripts/verify-remote-release-tag.sh \
            origin "v${VERSION}" "$BUILD_SHA"
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -A1 "^v${VERSION}$" | tail -1)"

      - name: Attach or compare the immutable release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          infra/scripts/verify-remote-release-tag.sh \
            origin "v${VERSION}" "$BUILD_SHA"
          ASSET="runsecure-v${VERSION}-release-images.json"
          mkdir .downloaded-release-asset
          if gh release download "v${VERSION}" \
              --pattern "$ASSET" \
              --dir .downloaded-release-asset 2>/dev/null; then
            cmp "$ASSET" ".downloaded-release-asset/$ASSET"
            echo "Existing release manifest matches exactly; leaving it unchanged."
            exit 0
          fi
          gh release upload "v${VERSION}" "$ASSET"
          gh release download "v${VERSION}" \
            --pattern "$ASSET" \
            --dir .downloaded-release-asset
          cmp "$ASSET" ".downloaded-release-asset/$ASSET"
