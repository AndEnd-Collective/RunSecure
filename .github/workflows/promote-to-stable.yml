# ============================================================================
# RunSecure — Promote Verified Immutable Manifests to Stable
# ============================================================================
# Unattended. Runs when post-publish-acceptance completes: if that run
# succeeded for a tag-push Publish Images run, the release is promoted with no
# human step. What gates a promotion:
#
#   - Publish Images succeeded for the pushed v<version> tag, which means
#     every Grype scan job passed on the pushed digests, and the tag's commit
#     was proven to be an ancestor of main;
#   - post-publish-acceptance succeeded against the exact manifest that
#     Publish Images run produced (immutable image@sha256 references);
#   - the release manifest verifies against the run, version and build SHA;
#   - every image in it carries build provenance signed by publish-images.yml
#     for that tag and commit.
#
# The exact Publish Images run and its validated release manifest, not a
# mutable canary tag, are the source for every server-side retag.
#
# Manual dispatch remains for re-running a promotion. It can additionally
# bind a live multi-runner acceptance receipt (live_acceptance_run_id +
# expected_scope); when supplied the receipt is verified as strictly as
# before, when omitted the gates above stand alone.
# ============================================================================

name: promote-to-stable

on:
  workflow_run:
    workflows: ["post-publish-acceptance"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Release version to promote (e.g. 2.1.8, without v)'
        required: true
        type: string
      publish_run_id:
        description: 'Successful tag-push Publish Images workflow run ID'
        required: true
        type: string
      acceptance_run_id:
        description: 'Successful post-publish-acceptance run for the exact Publish Images manifest'
        required: true
        type: string
      live_acceptance_run_id:
        description: 'Optional: successful live-release-acceptance run dispatched at the exact v<version> tag'
        required: false
        default: ''
        type: string
      expected_scope:
        description: 'Optional: exact RunSecure scope proven by the live-acceptance receipt (required with live_acceptance_run_id)'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  # Every release writes the same floating aliases, so versions must not race.
  group: promote-stable
  cancel-in-progress: false

jobs:
  # Normalise the two triggers into one set of values. For workflow_run the
  # acceptance run is the trigger itself; the Publish Images run it accepted
  # is named by its verified-publish-manifest-<run id> artifact, and the
  # version comes from that run's tag. Nothing here is trusted yet: every
  # value is re-verified against the GitHub API by resolve-manifest.
  resolve-inputs:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      image_version: ${{ steps.resolve.outputs.image_version }}
      publish_run_id: ${{ steps.resolve.outputs.publish_run_id }}
      acceptance_run_id: ${{ steps.resolve.outputs.acceptance_run_id }}
      live_acceptance_run_id: ${{ steps.resolve.outputs.live_acceptance_run_id }}
      expected_scope: ${{ steps.resolve.outputs.expected_scope }}
    steps:
      - name: Resolve what to promote
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_IMAGE_VERSION: ${{ inputs.image_version }}
          INPUT_PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          INPUT_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          INPUT_LIVE_ACCEPTANCE_RUN_ID: ${{ inputs.live_acceptance_run_id }}
          INPUT_EXPECTED_SCOPE: ${{ inputs.expected_scope }}
        run: |
          set -euo pipefail
          skip() {
            echo "Not promoting: $1"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "proceed=true"
              echo "image_version=${INPUT_IMAGE_VERSION}"
              echo "publish_run_id=${INPUT_PUBLISH_RUN_ID}"
              echo "acceptance_run_id=${INPUT_ACCEPTANCE_RUN_ID}"
              echo "live_acceptance_run_id=${INPUT_LIVE_ACCEPTANCE_RUN_ID}"
              echo "expected_scope=${INPUT_EXPECTED_SCOPE}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A skipped acceptance run (Publish Images failed) or a failed one
          # is the gate doing its job, not an error of this workflow.
          if [ "$TRIGGER_CONCLUSION" != "success" ]; then
            skip "post-publish-acceptance run ${TRIGGER_RUN_ID} concluded '${TRIGGER_CONCLUSION}'"
          fi
          if [[ ! "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::workflow_run event carries no acceptance run ID"
            exit 1
          fi

          PUBLISH_RUN_IDS=$(gh api --paginate \
            "/repos/${REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/artifacts" \
            --jq '.artifacts[].name' \
            | sed -n -E 's/^verified-publish-manifest-([1-9][0-9]*)$/\1/p')
          if [ "$(grep -c . <<<"$PUBLISH_RUN_IDS")" != "1" ]; then
            echo "::error::acceptance run ${TRIGGER_RUN_ID} must carry exactly one verified-publish-manifest artifact"
            exit 1
          fi
          PUBLISH_RUN_ID="$PUBLISH_RUN_IDS"

          PUBLISH_RUN=$(gh api "/repos/${REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}" \
            --jq '[.event, .head_branch] | @tsv')
          PUBLISH_EVENT=$(cut -f1 <<<"$PUBLISH_RUN")
          PUBLISH_REF=$(cut -f2 <<<"$PUBLISH_RUN")
          # Only a pushed release tag is promoted. A manual build
          # (workflow_dispatch, `manual-build` canary set) is accepted by the
          # acceptance suite too, and must stop here.
          if [ "$PUBLISH_EVENT" != "push" ] || [[ ! "$PUBLISH_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            skip "Publish Images run ${PUBLISH_RUN_ID} is '${PUBLISH_EVENT}' on '${PUBLISH_REF}', not a pushed release tag"
          fi

          {
            echo "proceed=true"
            echo "image_version=${PUBLISH_REF#v}"
            echo "publish_run_id=${PUBLISH_RUN_ID}"
            echo "acceptance_run_id=${TRIGGER_RUN_ID}"
            echo "live_acceptance_run_id="
            echo "expected_scope="
          } >> "$GITHUB_OUTPUT"

  resolve-manifest:
    needs: resolve-inputs
    if: needs.resolve-inputs.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      build_sha: ${{ steps.verify.outputs.build_sha }}
      publish_run_id: ${{ steps.verify.outputs.publish_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download manifest from the exact Publish Images run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image-manifest-${{ needs.resolve-inputs.outputs.image_version }}
          path: .publish-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-inputs.outputs.publish_run_id }}

      - name: Download manifest proven by the exact acceptance run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-publish-manifest-${{ needs.resolve-inputs.outputs.publish_run_id }}
          path: .accepted-manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-inputs.outputs.acceptance_run_id }}

      - name: Resolve the exact live-acceptance receipt artifact
        id: live-run
        if: needs.resolve-inputs.outputs.live_acceptance_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_ACCEPTANCE_RUN_ID: ${{ needs.resolve-inputs.outputs.live_acceptance_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$LIVE_ACCEPTANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::live_acceptance_run_id must be a positive integer"
            exit 1
          fi
          mkdir -p .live-acceptance
          gh api "/repos/${REPOSITORY}/actions/runs/${LIVE_ACCEPTANCE_RUN_ID}" \
            > .live-acceptance/workflow-run.json
          RUN_ATTEMPT=$(python3 - .live-acceptance/workflow-run.json <<'PY'
          import json
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          attempt = run.get("run_attempt")
          if not isinstance(attempt, int) or attempt < 1:
              raise SystemExit("live acceptance run has an invalid run_attempt")
          print(attempt)
          PY
          )
          echo "artifact_name=live-release-acceptance-${LIVE_ACCEPTANCE_RUN_ID}-${RUN_ATTEMPT}" \
            >> "$GITHUB_OUTPUT"

      - name: Download receipt from the exact live-acceptance run and attempt
        if: needs.resolve-inputs.outputs.live_acceptance_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.live-run.outputs.artifact_name }}
          path: .live-acceptance/receipt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-inputs.outputs.live_acceptance_run_id }}

      - name: Verify workflow-run and immutable manifest provenance
        id: verify
        env:
          EXPECTED_VERSION: ${{ needs.resolve-inputs.outputs.image_version }}
          EXPECTED_SCOPE: ${{ needs.resolve-inputs.outputs.expected_scope }}
          ACCEPTANCE_RUN_ID: ${{ needs.resolve-inputs.outputs.acceptance_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_ACCEPTANCE_RUN_ID: ${{ needs.resolve-inputs.outputs.live_acceptance_run_id }}
          PUBLISH_RUN_ID: ${{ needs.resolve-inputs.outputs.publish_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::image_version must be an exact semver without v"
            exit 1
          fi
          if [[ ! "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::publish_run_id must be a positive integer"
            exit 1
          fi
          if [[ ! "$ACCEPTANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::acceptance_run_id must be a positive integer"
            exit 1
          fi
          # The live receipt is optional, but it is all or nothing: a run ID
          # without the scope it must prove (or the reverse) is a mistake, not
          # a request to skip the check.
          if [ -n "$LIVE_ACCEPTANCE_RUN_ID" ] || [ -n "$EXPECTED_SCOPE" ]; then
            if [[ ! "$LIVE_ACCEPTANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::live_acceptance_run_id must be a positive integer when expected_scope is given"
              exit 1
            fi
            if [ -z "$EXPECTED_SCOPE" ]; then
              echo "::error::expected_scope is required with live_acceptance_run_id"
              exit 1
            fi
          fi

          gh api "/repos/${REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}" \
            > .publish-manifest/workflow-run.json
          BUILD_SHA=$(python3 - .publish-manifest/workflow-run.json "$EXPECTED_VERSION" <<'PY'
          import json
          import pathlib
          import re
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected_version = sys.argv[2]
          if run.get("name") != "Publish Images":
              raise SystemExit("not a Publish Images workflow run")
          if run.get("path") != ".github/workflows/publish-images.yml":
              raise SystemExit("workflow path does not match publish-images.yml")
          if run.get("event") != "push" or run.get("conclusion") != "success":
              raise SystemExit("Publish Images run must be a successful tag push")
          if run.get("head_branch") != f"v{expected_version}":
              raise SystemExit("Publish Images run is not for the expected release tag")
          build_sha = run.get("head_sha", "")
          if re.fullmatch(r"[0-9a-f]{40,64}", build_sha) is None:
              raise SystemExit("Publish Images run has an invalid head SHA")
          print(build_sha)
          PY
          )

          python3 infra/scripts/verify-release-manifest.py \
            .publish-manifest/release-images.json \
            --expected-release "$EXPECTED_VERSION" \
            --expected-build-sha "$BUILD_SHA" \
            --expected-publish-run-id "$PUBLISH_RUN_ID"

          gh api "/repos/${REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}" \
            > .accepted-manifest/workflow-run.json
          python3 - .accepted-manifest/workflow-run.json <<'PY'
          import json
          import pathlib
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if run.get("name") != "post-publish-acceptance":
              raise SystemExit("not a post-publish-acceptance workflow run")
          if run.get("path") != ".github/workflows/post-publish-acceptance.yml":
              raise SystemExit("workflow path does not match post-publish-acceptance.yml")
          if run.get("event") != "workflow_run":
              raise SystemExit("acceptance must be the automatic workflow_run gate")
          if run.get("conclusion") != "success":
              raise SystemExit("post-publish acceptance run did not succeed")
          PY

          python3 infra/scripts/verify-release-manifest.py \
            .accepted-manifest/release-images.json \
            --expected-release "$EXPECTED_VERSION" \
            --expected-build-sha "$BUILD_SHA" \
            --expected-publish-run-id "$PUBLISH_RUN_ID"
          if ! cmp -s .publish-manifest/release-images.json \
              .accepted-manifest/release-images.json; then
            echo "::error::accepted manifest differs from the exact Publish Images manifest"
            exit 1
          fi

          if [ -n "$LIVE_ACCEPTANCE_RUN_ID" ]; then
          # Re-fetch after the artifact download. If the operator reran the
          # live workflow between resolution and verification, its attempt
          # number will no longer match the downloaded receipt and promotion
          # fails instead of silently accepting an older attempt.
          gh api "/repos/${REPOSITORY}/actions/runs/${LIVE_ACCEPTANCE_RUN_ID}" \
            > .live-acceptance/workflow-run.json
          python3 - \
            .live-acceptance/workflow-run.json \
            .live-acceptance/receipt/receipt.json \
            .publish-manifest/release-images.json \
            "$EXPECTED_VERSION" "$BUILD_SHA" "$LIVE_ACCEPTANCE_RUN_ID" \
            "$EXPECTED_SCOPE" "$REPOSITORY" <<'PY'
          import json
          import pathlib
          import re
          import sys

          run_path, receipt_path, manifest_path = map(pathlib.Path, sys.argv[1:4])
          expected_version, build_sha, live_run_id_text, expected_scope, repository = sys.argv[4:9]
          live_run_id = int(live_run_id_text)
          run = json.loads(run_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          if run.get("id") != live_run_id:
              raise SystemExit("live acceptance API response has the wrong run ID")
          if run.get("name") != "live-release-acceptance":
              raise SystemExit("not a live-release-acceptance workflow run")
          if run.get("path") != ".github/workflows/live-release-acceptance.yml":
              raise SystemExit("live acceptance workflow path does not match")
          if run.get("event") != "workflow_dispatch":
              raise SystemExit("live acceptance must be operator-dispatched")
          if run.get("conclusion") != "success":
              raise SystemExit("live acceptance run did not succeed")
          if run.get("head_branch") != f"v{expected_version}":
              raise SystemExit("live acceptance was not dispatched at the release tag")
          if run.get("head_sha") != build_sha:
              raise SystemExit("live acceptance did not execute the release build SHA")
          if run.get("repository", {}).get("full_name") != repository:
              raise SystemExit("live acceptance belongs to a different repository")

          attempt = run.get("run_attempt")
          if not isinstance(attempt, int) or attempt < 1:
              raise SystemExit("live acceptance has an invalid run attempt")
          if receipt.get("schema_version") != 1:
              raise SystemExit("unsupported live acceptance receipt schema")
          if receipt.get("repository") != repository:
              raise SystemExit("live acceptance receipt repository mismatch")
          if receipt.get("workflow_path") != ".github/workflows/live-release-acceptance.yml":
              raise SystemExit("live acceptance receipt workflow mismatch")
          if receipt.get("run_id") != live_run_id or receipt.get("run_attempt") != attempt:
              raise SystemExit("live acceptance receipt run identity mismatch")
          if receipt.get("expected_version") != expected_version:
              raise SystemExit("live acceptance receipt version mismatch")
          if receipt.get("expected_build_sha") != build_sha:
              raise SystemExit("live acceptance receipt build SHA mismatch")
          if not expected_scope or receipt.get("expected_scope") != expected_scope:
              raise SystemExit("live acceptance receipt scope mismatch")
          images = manifest.get("images", {})
          if receipt.get("expected_runner_image_ref") != images.get("node-24"):
              raise SystemExit("live acceptance runner image differs from release manifest")
          if receipt.get("expected_proxy_image_ref") != images.get("proxy"):
              raise SystemExit("live acceptance proxy image differs from release manifest")

          expected_parallelism = receipt.get("expected_parallelism")
          observed_parallelism = receipt.get("observed_max_parallelism")
          if expected_parallelism != 3 or observed_parallelism != 3:
              raise SystemExit(
                  "live acceptance must prove exactly three concurrent runners"
              )
          if receipt.get("runtime_job_count") != 4:
              raise SystemExit("live acceptance did not verify four runtime jobs")
          if receipt.get("all_runtime_jobs_successful") is not True:
              raise SystemExit("live acceptance runtime jobs were not all successful")
          if receipt.get("all_logs_verified") is not True:
              raise SystemExit("live acceptance did not verify every job log")

          jobs = receipt.get("jobs")
          if not isinstance(jobs, list) or len(jobs) != 4:
              raise SystemExit("live acceptance receipt must contain four jobs")
          expected_names = {f"runtime-{slot}" for slot in range(1, 5)}
          job_ids = {job.get("job_id") for job in jobs}
          runner_ids = {job.get("runner_id") for job in jobs}
          runner_names = {job.get("runner_name") for job in jobs}
          if {job.get("job_name") for job in jobs} != expected_names:
              raise SystemExit("live acceptance receipt has unexpected runtime jobs")
          if (
              len(job_ids) != 4
              or any(not isinstance(value, int) or value < 1 for value in job_ids)
              or len(runner_ids) != 4
              or any(not isinstance(value, int) or value < 1 for value in runner_ids)
              or len(runner_names) != 4
          ):
              raise SystemExit("live acceptance JIT runner evidence is not distinct")
          for job in jobs:
              if job.get("conclusion") != "success":
                  raise SystemExit("live acceptance receipt contains a failed job")
              name_match = re.fullmatch(r"runtime-([1-4])", str(job.get("job_name", "")))
              runner_match = re.fullmatch(r"rs-(.+)-runner", str(job.get("runner_name", "")))
              log = job.get("log")
              if name_match is None or runner_match is None or not isinstance(log, dict):
                  raise SystemExit("live acceptance receipt has malformed runner evidence")
              expected_marker = (
                  f"RUNSECURE_LIVE_COMPLETE scope={expected_scope} "
                  f"slot={name_match.group(1)} "
                  f"spawn={runner_match.group(1)}"
              )
              if (
                  log.get("verified") is not True
                  or not isinstance(log.get("bytes"), int)
                  or log["bytes"] < 1
                  or log.get("completion_marker") != expected_marker
              ):
                  raise SystemExit("live acceptance receipt has invalid log evidence")
          PY
            echo "Live acceptance receipt verified for scope ${EXPECTED_SCOPE}."
          else
            echo "No live acceptance receipt supplied; promoting on the Publish Images and post-publish-acceptance gates."
          fi

          {
            echo "version=$EXPECTED_VERSION"
            echo "build_sha=$BUILD_SHA"
            echo "publish_run_id=$PUBLISH_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve the verified manifest for promotion and release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-image-manifest-${{ needs.resolve-inputs.outputs.image_version }}
          path: .publish-manifest/release-images.json
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: resolve-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-manifest.outputs.build_sha }}

      - name: Download verified immutable manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-image-manifest-${{ needs.resolve-manifest.outputs.version }}
          path: .verified-manifest

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate preflight, version promotion, and alias barrier
        env:
          BUILD_SHA: ${{ needs.resolve-manifest.outputs.build_sha }}
          VERSION: ${{ needs.resolve-manifest.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          infra/scripts/verify-remote-release-tag.sh \
            origin "v${VERSION}" "$BUILD_SHA"
          # No stable tag moves unless every image in the manifest carries
          # build provenance signed by publish-images.yml for this exact tag
          # and commit.
          infra/scripts/verify-image-provenance.sh \
            .verified-manifest/release-images.json \
            "$REPOSITORY" "refs/tags/v${VERSION}" "$BUILD_SHA"
          python3 infra/scripts/promote-release-images.py \
            .verified-manifest/release-images.json \
            --release "$VERSION"

  release:
    needs: [resolve-manifest, promote]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      BUILD_SHA: ${{ needs.resolve-manifest.outputs.build_sha }}
      VERSION: ${{ needs.resolve-manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-manifest.outputs.build_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download verified release manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-image-manifest-${{ needs.resolve-manifest.outputs.version }}
          path: .verified-manifest

      - name: Prepare durable release asset
        run: |
          cp .verified-manifest/release-images.json \
            "runsecure-v${VERSION}-release-images.json"

      - name: Delete orphan draft and detect an existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          infra/scripts/verify-remote-release-tag.sh \
            origin "v${VERSION}" "$BUILD_SHA"
          if existing=$(gh release view "v${VERSION}" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$existing" = "true" ]; then
              gh release delete "v${VERSION}" --yes
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with auto-generated notes
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          infra/scripts/verify-remote-release-tag.sh \
            origin "v${VERSION}" "$BUILD_SHA"
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -A1 "^v${VERSION}$" | tail -1)"

      - name: Attach or compare the immutable release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          infra/scripts/verify-remote-release-tag.sh \
            origin "v${VERSION}" "$BUILD_SHA"
          ASSET="runsecure-v${VERSION}-release-images.json"
          mkdir .downloaded-release-asset
          if gh release download "v${VERSION}" \
              --pattern "$ASSET" \
              --dir .downloaded-release-asset 2>/dev/null; then
            cmp "$ASSET" ".downloaded-release-asset/$ASSET"
            echo "Existing release manifest matches exactly; leaving it unchanged."
            exit 0
          fi
          gh release upload "v${VERSION}" "$ASSET"
          gh release download "v${VERSION}" \
            --pattern "$ASSET" \
            --dir .downloaded-release-asset
          cmp "$ASSET" ".downloaded-release-asset/$ASSET"
