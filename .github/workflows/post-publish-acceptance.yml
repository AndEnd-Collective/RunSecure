# ============================================================================
# RunSecure — Post-Publish Acceptance Tests
# ============================================================================
# Runs automatically after Publish Images. It downloads the release manifest
# from that exact workflow run, verifies the run/version/build provenance, and
# tests immutable image@sha256 references. Concurrent releases cannot cause
# this workflow to test a newer mutable tag by accident.
# ============================================================================

name: post-publish-acceptance

on:
  workflow_run:
    workflows: ["Publish Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Expected release version from the Publish Images manifest'
        required: true
        type: string
      publish_run_id:
        description: 'Successful Publish Images workflow run ID to test'
        required: true
        type: string

permissions: {}

jobs:
  resolve-manifest:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      build_sha: ${{ steps.verify.outputs.build_sha }}
      publish_run_id: ${{ steps.verify.outputs.publish_run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download manifest from the triggering Publish Images run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-image-manifest-*
          path: .publish-manifest
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.publish_run_id }}

      - name: Verify workflow-run and immutable manifest provenance
        id: verify
        env:
          EXPECTED_VERSION: ${{ inputs.image_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::publish_run_id must be a positive integer"
            exit 1
          fi
          if [ ! -f .publish-manifest/release-images.json ]; then
            echo "::error::exact Publish Images run did not produce one release manifest"
            exit 1
          fi

          gh api "/repos/${REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}" \
            > .publish-manifest/workflow-run.json
          BUILD_SHA=$(python3 - .publish-manifest/workflow-run.json <<'PY'
          import json
          import pathlib
          import re
          import sys

          run = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if run.get("name") != "Publish Images":
              raise SystemExit("not a Publish Images workflow run")
          if run.get("path") != ".github/workflows/publish-images.yml":
              raise SystemExit("workflow path does not match publish-images.yml")
          if run.get("event") not in {"push", "workflow_dispatch"}:
              raise SystemExit("unsupported Publish Images event")
          if run.get("conclusion") != "success":
              raise SystemExit("Publish Images run did not succeed")
          build_sha = run.get("head_sha", "")
          if re.fullmatch(r"[0-9a-f]{40,64}", build_sha) is None:
              raise SystemExit("Publish Images run has an invalid head SHA")
          print(build_sha)
          PY
          )

          verify_args=(
            .publish-manifest/release-images.json
            --expected-build-sha "$BUILD_SHA"
            --expected-publish-run-id "$PUBLISH_RUN_ID"
          )
          if [ -n "$EXPECTED_VERSION" ]; then
            verify_args+=(--expected-release "$EXPECTED_VERSION")
          fi
          python3 infra/scripts/verify-release-manifest.py "${verify_args[@]}"

          python3 - .publish-manifest/release-images.json "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"version={manifest['release']}\n")
              output.write(f"build_sha={manifest['build_sha']}\n")
              output.write(f"publish_run_id={manifest['publish_run_id']}\n")
          PY

      - name: Preserve the verified acceptance input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-publish-manifest-${{ steps.verify.outputs.publish_run_id }}
          path: .publish-manifest/release-images.json
          if-no-files-found: error
          retention-days: 90

  acceptance:
    needs: resolve-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: node
            lang_version: "24"
            manifest_key: node-24
          - lang: node
            lang_version: "22"
            manifest_key: node-22
          - lang: python
            lang_version: "3.12"
            manifest_key: python-3.12
          - lang: rust
            lang_version: "stable"
            manifest_key: rust-stable
    env:
      LANG: ${{ matrix.lang }}
      LANG_VERSION: ${{ matrix.lang_version }}
      MANIFEST_KEY: ${{ matrix.manifest_key }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-manifest.outputs.build_sha }}

      - name: Download verified immutable manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-publish-manifest-${{ needs.resolve-manifest.outputs.publish_run_id }}
          path: .verified-manifest

      - name: Resolve exact immutable acceptance images
        run: |
          python3 - .verified-manifest/release-images.json "$MANIFEST_KEY" "$GITHUB_ENV" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          with pathlib.Path(sys.argv[3]).open("a", encoding="utf-8") as output:
              output.write(f"PROXY_IMAGE_REF={manifest['images']['proxy']}\n")
              output.write(f"RUNNER_IMAGE_REF={manifest['images'][sys.argv[2]]}\n")
          PY

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published immutable images
        run: |
          set -euo pipefail
          docker pull "$PROXY_IMAGE_REF"
          docker pull "$RUNNER_IMAGE_REF"

      - name: Run acceptance suite (capture output for SARIF)
        id: acceptance
        working-directory: tests/acceptance
        run: |
          set -uo pipefail
          mkdir -p _sarif
          if docker compose -f docker-compose.acceptance.yml up \
                --abort-on-container-exit --exit-code-from runner \
                2>&1 | tee _sarif/raw-output.log; then
            echo "acceptance_exit=0" >> "$GITHUB_OUTPUT"
          else
            echo "acceptance_exit=$?" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SARIF from acceptance output
        if: always() && hashFiles('tests/acceptance/_sarif/raw-output.log') != ''
        working-directory: tests/acceptance
        env:
          COMMIT_SHA: ${{ needs.resolve-manifest.outputs.build_sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pyyaml
          python3 sarif-emitter.py \
            --claims claims.yml \
            --image-ref "$RUNNER_IMAGE_REF" \
            --commit-sha "$COMMIT_SHA" \
            --output "_sarif/acceptance-${LANG}-${LANG_VERSION}.sarif" \
            < _sarif/raw-output.log
          ls -la _sarif/

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('tests/acceptance/_sarif/acceptance-*.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: tests/acceptance/_sarif/
          category: "acceptance-${{ matrix.lang }}-${{ matrix.lang_version }}"

      - name: Re-raise acceptance failure (after SARIF upload)
        if: always() && steps.acceptance.outputs.acceptance_exit != '0'
        run: |
          echo "::error::Acceptance suite reported failures (exit ${{ steps.acceptance.outputs.acceptance_exit }}). See Code Scanning Security tab for per-claim findings."
          exit 1

      - name: Teardown
        if: always()
        working-directory: tests/acceptance
        run: |
          docker compose -f docker-compose.acceptance.yml down -v 2>/dev/null || true
          docker rm -f rs-acceptance-proxy rs-acceptance-runner 2>/dev/null || true
