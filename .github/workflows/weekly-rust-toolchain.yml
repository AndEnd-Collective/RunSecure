# ============================================================================
# RunSecure — Weekly Rust Toolchain Certification
# ============================================================================
# Rust is the only toolchain we cannot simply follow. `--default-toolchain
# stable` made the image non-reproducible, and worse, syft's
# binary-classifier-cataloger stopped recognising rustc at 1.98.0 — so the
# toolchain disappeared from the SBOM, rust CVEs became unscannable, and the
# publish gate failed closed on every release.
#
# images/rust.Dockerfile therefore pins RUST_STABLE_PIN to the newest rustc the
# scanner can still inventory. This workflow is what moves that pin: every
# Sunday it tries the current upstream stable, builds the image with it, and
# runs the same certification the release pipeline runs. The pin is bumped ONLY
# if that certification passes, via a PR — never silently, and never ahead of
# the scanner.
#
# Scheduled Sunday so a passing bump PR can be reviewed and merged before
# weekly-version-bump tags on Monday 02:30 UTC, i.e. the toolchain is certified
# before it is published.
#
# A failed certification is a NORMAL outcome: it means upstream rust is ahead
# of the pinned syft. The run still succeeds and reports why the pin was not
# moved, so this does not generate a weekly red run that everyone learns to
# ignore. The only hard failures here are infrastructure problems.
# ============================================================================

name: weekly-rust-toolchain

on:
  schedule:
    # Sunday 02:30 UTC — 24h before the weekly version bump.
    - cron: '30 2 * * 0'
  workflow_dispatch:
    inputs:
      rust_version:
        description: 'Certify this exact rust version instead of upstream stable'
        required: false
        type: string

permissions: {}

jobs:
  # --- Resolve once so every arch certifies the same candidate --------------
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.versions.outputs.current }}
      candidate: ${{ steps.versions.outputs.candidate }}
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Resolve candidate and current pin
        id: versions
        env:
          REQUESTED: ${{ github.event.inputs.rust_version }}
        run: |
          set -euo pipefail
          CURRENT=$(awk -F= '$1=="ARG RUST_STABLE_PIN"{print $2; exit}' images/rust.Dockerfile)
          if [ -z "$CURRENT" ]; then
            echo "::error::could not read ARG RUST_STABLE_PIN from images/rust.Dockerfile"
            exit 1
          fi
          if [ -n "$REQUESTED" ]; then
            CANDIDATE="$REQUESTED"
          else
            # The stable channel manifest reports the cargo version in its
            # `version` field, so take the rustc version from the rustc package.
            CANDIDATE=$(curl --proto '=https' --tlsv1.2 -sSf \
              https://static.rust-lang.org/dist/channel-rust-stable.toml \
              | awk '/^\[pkg\.rustc\]/{f=1} f&&/^version = /{print $3; exit}' \
              | tr -d '"')
          fi
          if ! echo "$CANDIDATE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::could not resolve a concrete rust version (got '${CANDIDATE}')"
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "Current pin: $CURRENT"
          echo "Candidate:   $CANDIDATE"

      - name: Skip when already current
        id: gate
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          CANDIDATE: ${{ steps.versions.outputs.candidate }}
        run: |
          set -euo pipefail
          if [ "$CURRENT" = "$CANDIDATE" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Pin is already at the latest stable ($CURRENT); nothing to certify." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  # --- Certify the candidate on EVERY published architecture ---------------
  # publish-images builds and scans linux/amd64 and linux/arm64, so the
  # certification has to cover both or it is not actually certifying the
  # release. An arch-specific regression — a classifier that only recognises
  # one of the two rustc builds, or a HIGH that only appears in one base image
  # — would otherwise sail through here and block the publish instead.
  # arm64 is emulated via QEMU on the amd64 runner, the same way the publish
  # pipeline cross-builds.
  certify:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install checksum-pinned Syft + Grype
        run: |
          set -euo pipefail
          infra/scripts/install-pinned-scanners.sh /usr/local/bin

      - name: Build base and candidate rust image for ${{ matrix.platform }}
        env:
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          docker build --platform "$PLATFORM" \
            -f images/base.Dockerfile -t "runner-base:${SLUG}" .
          # Build through RUST_VERSION=stable with the candidate supplied as the
          # pin, so this exercises the exact resolution path every consumer
          # uses rather than a one-off explicit-version build.
          docker build --platform "$PLATFORM" \
            -f images/rust.Dockerfile \
            --build-arg "BASE_TAG=${SLUG}" \
            --build-arg RUST_VERSION=stable \
            --build-arg "RUST_STABLE_PIN=${CANDIDATE}" \
            -t "runner-rust:candidate-${SLUG}" .
          docker run --rm --platform "$PLATFORM" \
            --entrypoint sh "runner-rust:candidate-${SLUG}" -c 'rustc --version'

      # Same script, same arguments, same pinned scanners as the rust jobs in
      # publish-images.yml. If this cannot pass, the release cannot either.
      - name: Certify — Grype gate + rust inventory presence
        id: certify
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          bash infra/scripts/grype-scan-image.sh \
            "runner-rust:candidate-${SLUG}" \
            "rust-candidate-${SLUG}.sarif" \
            ca-certificates '' '' \
            binary-classifier-cataloger rust

      - name: Certify — rust terminal-stage hardening contract
        run: |
          set -euo pipefail
          bash tests/validation/test-language-terminal-stages.sh

  # --- Move the pin only if EVERY arch certified ---------------------------
  bump:
    needs: [resolve, certify]
    # `always()` so this job still runs when a certify matrix leg failed, and
    # the explicit result check decides. Without it the job would be skipped
    # and the "not adopted" summary would never be written.
    if: always() && needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Report a failed certification and stop
        if: needs.certify.result != 'success'
        env:
          CURRENT: ${{ needs.resolve.outputs.current }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          CERTIFY_RESULT: ${{ needs.certify.result }}
        run: |
          {
            echo "### Rust ${CANDIDATE} NOT adopted"
            echo
            echo "The pin stays at **${CURRENT}**."
            echo
            echo "Certification across linux/amd64 and linux/arm64: **${CERTIFY_RESULT}**."
            echo "See the per-architecture \`certify\` jobs for which one failed."
            echo
            echo "This is expected when upstream rust is ahead of the pinned syft:"
            echo "the toolchain would not appear in the SBOM, so rust CVEs would not"
            echo "be scannable and the publish gate would fail closed."
            echo
            echo "Nothing to do — the next bump of \`SYFT_VERSION\` in"
            echo "\`infra/scripts/install-pinned-scanners.sh\` may unblock it."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.certify.result == 'success'
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Open the pin-bump PR
        if: needs.certify.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CURRENT: ${{ needs.resolve.outputs.current }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
        run: |
          set -euo pipefail
          BRANCH="bot/rust-toolchain-${CANDIDATE}"
          python3 - "$CURRENT" "$CANDIDATE" <<'PY'
          import pathlib, re, sys
          current, candidate = sys.argv[1], sys.argv[2]
          p = pathlib.Path("images/rust.Dockerfile")
          text = p.read_text()
          updated, n = re.subn(
              rf"^ARG RUST_STABLE_PIN={re.escape(current)}$",
              f"ARG RUST_STABLE_PIN={candidate}",
              text,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit(f"expected exactly one RUST_STABLE_PIN={current} line, replaced {n}")
          # Keep the recorded evidence table from outliving the version it describes.
          updated = re.sub(
              r"(#   )[0-9]+\.[0-9]+\.[0-9]+(  classified as rust )[0-9]+\.[0-9]+\.[0-9]+(   <- newest that works)",
              rf"\g<1>{candidate}\g<2>{candidate}\g<3>",
              updated,
              count=1,
          )
          p.write_text(updated)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add images/rust.Dockerfile
          git commit -m "chore(rust): certify and pin toolchain ${CANDIDATE}"
          git push origin "HEAD:refs/heads/${BRANCH}"

          # Body goes through a file: a multi-line shell string here would have
          # to start at column 0 and would terminate the YAML block scalar.
          {
            printf '%s\n\n' "Automated weekly rust toolchain certification."
            printf 'Bumps `RUST_STABLE_PIN` in `images/rust.Dockerfile` from `%s` to `%s`.\n\n' \
              "$CURRENT" "$CANDIDATE"
            printf '%s\n\n' "The candidate was built through \`RUST_VERSION=stable\` — the same resolution path every consumer uses — on **both linux/amd64 and linux/arm64**, and passed the identical certification the release pipeline runs on each, with the same checksum-pinned Syft and Grype:"
            printf '%s\n' "- \`infra/scripts/grype-scan-image.sh\` with \`binary-classifier-cataloger:rust\`, proving the toolchain is still inventoried in the SBOM and that no fixable HIGH/CRITICAL is present"
            printf '%s\n\n' "- \`tests/validation/test-language-terminal-stages.sh\`"
            printf '%s\n' "The pin is only ever moved by this workflow, and only after every published architecture certifies, so rust can never get ahead of what the scanner can see."
          } > /tmp/rust-pr-body.md

          if gh pr create \
            --base main --head "$BRANCH" \
            --title "chore(rust): certify and pin toolchain ${CANDIDATE}" \
            --body-file /tmp/rust-pr-body.md; then
            {
              echo "### Rust ${CANDIDATE} certified on amd64 + arm64"
              echo
              echo "Opened a PR bumping the pin from \`${CURRENT}\` to \`${CANDIDATE}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::pin bump pushed to ${BRANCH} but PR creation failed"
          fi
