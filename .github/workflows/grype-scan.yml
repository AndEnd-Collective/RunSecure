# ============================================================================
# RunSecure — Grype CVE Scan (PR-level)
# ============================================================================
# Builds runner-base, runner-node:24, and runner-python:3.12 from the PR's
# code and scans each with Grype. Runs on every PR that touches image
# construction, terminal hardening, scanner validation, or tools.
#
# Failure threshold: HIGH+CRITICAL with a fix available. Issues without
# upstream fixes are uploaded to the Security tab as SARIF but don't block
# (chasing unfixable issues creates noise).
#
# Implementation note: Syft and Grype are installed by RunSecure's pinned,
# checksum-verifying wrapper rather than via anchore/scan-action. The action wrapper
# bundles a pinned grype binary that has periodically failed with a
# "vulnerability database was built N weeks ago (max allowed age is 5
# days)" error when Anchore's DB CDN drifts past the pinned grype's
# tolerance. The gate scans one explicit ecosystem-aware Syft SBOM, excluding
# only generic raw-binary classifiers that lose distro patch context after
# terminal hardening. Dpkg, npm, Python, Go, Cargo, and .NET catalogers remain.
#
# A separate post-publish Grype scan runs in publish-images.yml against
# the images that actually got pushed to GHCR.
# ============================================================================

name: grype-scan

on:
  pull_request:
    paths:
      - 'images/**'
      - 'infra/scripts/finalize-hardening.sh'
      - 'infra/scripts/grype-scan-image.sh'
      - 'infra/scripts/install-pinned-scanners.sh'
      - 'tests/validation/test-cve-scanner-config.sh'
      - 'tests/validation/test-grype-scan-image.sh'
      - 'tests/validation/test-scanner-package-inventory.sh'
      - 'tests/validation/test-scanner-installer-pins.sh'
      - 'tools/**'
      - '.github/workflows/grype-scan.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: runner-base
            dockerfile: images/base.Dockerfile
            build_arg: ''
            expected_dpkg_package: ca-certificates
            expected_cataloger: ''
            expected_cataloger_package: ''
          - image_name: runner-node-24
            dockerfile: images/node.Dockerfile
            build_arg: 'NODE_VERSION=24'
            expected_dpkg_package: nodejs
            expected_cataloger: javascript-package-cataloger
            expected_cataloger_package: npm
          - image_name: runner-python-3.12
            dockerfile: images/python.Dockerfile
            build_arg: 'PYTHON_VERSION=3.12'
            expected_dpkg_package: ca-certificates
            expected_cataloger: python-installed-package-cataloger
            expected_cataloger_package: pip
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      BUILD_ARG: ${{ matrix.build_arg }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build base image (when target is not base)
        if: matrix.image_name != 'runner-base'
        run: docker build -f images/base.Dockerfile -t runner-base:latest .

      - name: Build target image
        run: |
          if [ -n "$BUILD_ARG" ]; then
            docker build -f "$DOCKERFILE" --build-arg "$BUILD_ARG" -t "${IMAGE_NAME}:scan" .
          else
            docker build -f "$DOCKERFILE" -t "${IMAGE_NAME}:scan" .
          fi

      - name: Install checksum-pinned Syft + Grype
        run: |
          set -euo pipefail
          infra/scripts/install-pinned-scanners.sh /usr/local/bin

      - name: Prove finalized Node dpkg inventory is scanner-visible
        if: matrix.image_name == 'runner-node-24'
        run: |
          bash tests/validation/test-scanner-package-inventory.sh \
            "${IMAGE_NAME}:scan" nodejs

      - name: Grype scan — fail on HIGH/CRITICAL with fix
        id: grype
        env:
          EXPECTED_DPKG_PACKAGE: ${{ matrix.expected_dpkg_package }}
          EXPECTED_CATALOGER: ${{ matrix.expected_cataloger }}
          EXPECTED_CATALOGER_PACKAGE: ${{ matrix.expected_cataloger_package }}
        run: |
          set -euo pipefail
          bash infra/scripts/grype-scan-image.sh \
            "${IMAGE_NAME}:scan" \
            grype-results.sarif \
            "$EXPECTED_DPKG_PACKAGE" \
            "$EXPECTED_CATALOGER" \
            "$EXPECTED_CATALOGER_PACKAGE"

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('grype-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: grype-results.sarif
          category: 'grype-${{ matrix.image_name }}'
