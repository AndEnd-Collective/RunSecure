{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "replicaCount must be exactly 1; RunSecure has no distributed leader election" -}}
{{- end -}}
{{- if lt (int .Values.terminationGracePeriodSeconds) 90 -}}
{{- fail "terminationGracePeriodSeconds must be at least 90" -}}
{{- end -}}
{{/*
Orchestrator Deployment.

Security invariants (PSS Restricted + CIS Benchmark v1.9):
  - runAsNonRoot: true, runAsUser: 1001
  - allowPrivilegeEscalation: false
  - readOnlyRootFilesystem: true
  - capabilities: drop ALL
  - seccompProfile: RuntimeDefault
  - No host namespaces (hostNetwork/hostPID/hostIPC: false)
  - No hostPath volumes
  - automountServiceAccountToken: true ONLY for the orchestrator pod
    (it must reach kube-apiserver; the SA is namespace-Role-scoped)

Volumes:
  - scope-config  : ConfigMap  scope.yml → /etc/runsecure/scope.yml (ro)
  - auth-secret   : Secret     PAT or App key → /run/secrets/... (0440)
  - tmp           : emptyDir   /tmp (writable; readOnlyRootFilesystem=true
                    requires a writable /tmp)
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runsecure-orchestrator.fullname" . }}
  namespace: {{ include "runsecure-orchestrator.namespace" . }}
  labels:
    {{- include "runsecure-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Cold-start reconciliation is intentionally single-owner. Recreate prevents
  # a surge pod from deleting a predecessor's pending JIT runner during upgrade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "runsecure-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "runsecure-orchestrator.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "runsecure-orchestrator.serviceAccountName" . }}
      # The orchestrator pod needs the SA token to reach kube-apiserver.
      # Runner pods (managed by the orchestrator) have this false.
      automountServiceAccountToken: true

      # PSS Restricted — pod-level security context.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # No host namespace sharing.
      hostNetwork: false
      hostPID: false
      hostIPC: false

      volumes:
        # Scope configuration from ConfigMap.
        - name: scope-config
          configMap:
            name: {{ include "runsecure-orchestrator.fullname" . }}-scope
            defaultMode: 0444
        # Auth secret — PAT or GitHub App private key.
        # Kubernetes Secret projections remain root-owned. fsGroup=1001 makes
        # GID 1001 the group owner, so 0440 is the least-privilege readable
        # mode for the non-root orchestrator (no world access).
        {{- if eq .Values.auth.type "pat" }}
        - name: auth-secret
          secret:
            secretName: {{ include "runsecure-orchestrator.patSecretName" . }}
            defaultMode: 0440
        {{- else if eq .Values.auth.type "github_app" }}
        - name: auth-secret
          secret:
            secretName: {{ include "runsecure-orchestrator.appPrivKeySecretName" . }}
            defaultMode: 0440
        {{- end }}
        # Writable ephemeral /tmp (required because readOnlyRootFilesystem=true).
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

      containers:
        - name: orchestrator
          image: {{ include "runsecure-orchestrator.image" . }}
          imagePullPolicy: {{ .Values.image.orchestrator.pullPolicy }}

          # PSS Restricted — container-level security context.
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: state
              containerPort: 8081
              protocol: TCP

          env:
            - name: RUNSECURE_SCOPE_FILE
              value: /etc/runsecure/scope.yml
            - name: RUNSECURE_BACKEND
              value: {{ .Values.scope.backend | quote }}
            - name: RUNSECURE_EGRESS_BASE_DIR
              value: /tmp/runsecure/egress
            - name: RUNSECURE_KUBE_API_SERVER_PEERS
              value: {{ .Values.kubernetesNetwork.apiServerPeers | toJson | quote }}
            - name: RUNSECURE_KUBE_DNS_SERVICE_CIDRS
              value: {{ join "," .Values.kubernetesNetwork.dnsServiceCIDRs | quote }}
            - name: RUNSECURE_KUBE_DNS_NAMESPACE
              value: {{ .Values.kubernetesNetwork.dnsNamespace | quote }}
            - name: RUNSECURE_KUBE_DNS_POD_LABEL_KEY
              value: {{ .Values.kubernetesNetwork.dnsPodLabel.key | quote }}
            - name: RUNSECURE_KUBE_DNS_POD_LABEL_VALUE
              value: {{ .Values.kubernetesNetwork.dnsPodLabel.value | quote }}
            - name: RUNSECURE_PROXY_IMAGE
              value: {{ include "runsecure-orchestrator.imageRef" .Values.image.proxy | quote }}
            - name: RUNSECURE_RUNNER_IMAGE_DEFAULT
              value: {{ include "runsecure-orchestrator.imageRef" .Values.image.runners.default | quote }}
            - name: RUNSECURE_RUNNER_IMAGE_NODE
              value: {{ include "runsecure-orchestrator.imageRef" .Values.image.runners.node | quote }}
            - name: RUNSECURE_RUNNER_IMAGE_PYTHON
              value: {{ include "runsecure-orchestrator.imageRef" .Values.image.runners.python | quote }}
            - name: RUNSECURE_RUNNER_IMAGE_RUST
              value: {{ include "runsecure-orchestrator.imageRef" .Values.image.runners.rust | quote }}
            {{- if eq .Values.auth.type "pat" }}
            - name: RUNSECURE_PAT_FILE
              value: /run/secrets/runsecure-pat/pat
            {{- else if eq .Values.auth.type "github_app" }}
            - name: RUNSECURE_APP_PRIVATE_KEY_FILE
              value: /run/secrets/runsecure-app-key/private-key
            - name: RUNSECURE_APP_ID
              value: {{ .Values.auth.app.appId | quote }}
            - name: RUNSECURE_APP_INSTALLATION_ID
              value: {{ .Values.auth.app.installationId | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          volumeMounts:
            - name: scope-config
              mountPath: /etc/runsecure
              readOnly: true
            {{- if or (eq .Values.auth.type "pat") (eq .Values.auth.type "github_app") }}
            - name: auth-secret
              {{- if eq .Values.auth.type "pat" }}
              mountPath: /run/secrets/runsecure-pat
              {{- else }}
              mountPath: /run/secrets/runsecure-app-key
              {{- end }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
