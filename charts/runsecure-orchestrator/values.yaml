# ============================================================================
# RunSecure Orchestrator — Helm values
# One release = one scope. Override this file for each scope you deploy.
# ============================================================================

# ---------------------------------------------------------------------------
# Image configuration — pin by digest for reproducibility and integrity.
# The 'digest' field takes precedence over 'tag'; both must be set when
# deploying to production (the digest is the authoritative pin).
# ---------------------------------------------------------------------------
image:
  orchestrator:
    repository: ghcr.io/andend-collective/runsecure/orchestrator
    tag: "2.1.2"
    digest: "sha256:cd5918ac59cc2b8261afecc1e6b43e3fcb14cd8b60329fc4088d99832c0155c5"
    pullPolicy: Always
  proxy:
    repository: ghcr.io/andend-collective/runsecure/proxy
    tag: "2.1.2"
    digest: "sha256:653a28372741957135874c517b7a743a95ff27f7a7c3ffa293fd5cf2cf7dc3b0"
    pullPolicy: Always
  # Terminal runner images admitted by the Kubernetes backend. Each value is
  # rendered into the orchestrator environment as repository@digest; mutable
  # tags are metadata only and are never passed to a spawned Pod.
  runners:
    default:
      repository: ghcr.io/andend-collective/runsecure/node
      tag: "2.1.2-24"
      digest: "sha256:84461b287a4dfd5862da4683f1860a774a4436cb5c1782b7dece5e9d33d130db"
      pullPolicy: Always
    node:
      repository: ghcr.io/andend-collective/runsecure/node
      tag: "2.1.2-24"
      digest: "sha256:84461b287a4dfd5862da4683f1860a774a4436cb5c1782b7dece5e9d33d130db"
      pullPolicy: Always
    python:
      repository: ghcr.io/andend-collective/runsecure/python
      tag: "2.1.2-3.12"
      digest: "sha256:eb4cc90f909ac420aff7d368ce4269e9cb540d21774fdd3d1eb2d86ddb2c02e2"
      pullPolicy: Always
    rust:
      repository: ghcr.io/andend-collective/runsecure/rust
      tag: "2.1.2-stable"
      digest: "sha256:c861102a49db8e1703787e93d84a8b383056ae5cc83b4e78d3f0c208589834b7"
      pullPolicy: Always
  socketProxy:
    repository: ghcr.io/andend-collective/runsecure/socket-proxy
    tag: "2.1.2"
    digest: "sha256:4a7af59d856a98a1f4515d67c6eb881f604bf01bd834ccd5bb8f2d91cfdc5778"
    pullPolicy: Always

# ---------------------------------------------------------------------------
# Kubernetes network dependencies. API traffic can be evaluated before or
# after Service DNAT. Each API destination is an exact CIDR/port pair so a
# Service address cannot inherit an endpoint port (or vice versa). DNS requires
# both exact Service /32s and an exact namespace + Pod label selector.
# ---------------------------------------------------------------------------
kubernetesNetwork:
  apiServerPeers:
    - cidr: "10.96.0.1/32"
      port: 443
  dnsServiceCIDRs:
    - "10.96.0.10/32"
  dnsNamespace: "kube-system"
  dnsPodLabel:
    key: "k8s-app"
    value: "kube-dns"

# ---------------------------------------------------------------------------
# Scope configuration — mirrors infra/orchestrator/scopes/example.yml.
# ---------------------------------------------------------------------------
scope:
  # A short, lowercase name used for the namespace (runsecure-<name>)
  # and all runsecure.io/* labels. Required.
  name: "default"
  description: "Default scope"

  # Backend: 'kube' (this chart) or 'compose'. Must be 'kube' for this chart.
  backend: kube

  # Host-wide ceiling across all repos in this scope.
  globalMaxRunners: 5

  # Poll cadence in seconds. Minimum 5.
  pollIntervalSeconds: 15

  # Security profile: strict | standard | permissive | custom
  securityProfile: strict

  # Which knobs a project's runner.yml is allowed to override.
  allowProjectOverrides:
    - allow_wildcards

  # Orchestrator-side egress allow-list (for the orchestrator's own traffic,
  # e.g. reaching GitHub API). Runner egress is controlled by runner.yml.
  orchEgress:
    allowDomains:
      - api.github.com

  # Repositories managed by this scope.
  repos: []
  # Example:
  # repos:
  #   - repo: owner/repo
  #     maxConcurrent: 3

# ---------------------------------------------------------------------------
# Authentication — PAT or GitHub App.
# ---------------------------------------------------------------------------
auth:
  # 'pat' or 'github_app'
  type: pat

  # --- PAT auth ---
  # Name of a pre-existing Secret with key 'pat' in the orchestrator namespace.
  # Used when auth.type == 'pat' and auth.pat.value is empty (preferred).
  pat:
    # Inline value — leave empty in production; reference an external secret instead.
    value: ""
    # Name of a pre-existing k8s Secret containing key 'pat'. If set, takes
    # precedence over auth.pat.value.
    existingSecretName: ""

  # --- GitHub App auth ---
  app:
    appId: ""
    installationId: ""
    # Name of a pre-existing Secret with key 'private-key' (PEM).
    privateKeySecretName: ""

# ---------------------------------------------------------------------------
# TLS (cert-manager). Gated: templates render only when tls.enabled=true.
# ---------------------------------------------------------------------------
tls:
  enabled: false
  # When selfSigned=true, emit a self-signed cert-manager Issuer.
  # When false, reference an existing Issuer/ClusterIssuer via issuerName.
  selfSigned: true
  # Name of the Issuer or ClusterIssuer to use when selfSigned=false.
  issuerName: ""
  # cert-manager issuer kind: Issuer or ClusterIssuer
  issuerKind: Issuer
  # Secret name for the generated TLS certificate.
  secretName: "runsecure-orchestrator-tls"
  # DNS names for the certificate.
  dnsNames: []

# ---------------------------------------------------------------------------
# Deployment configuration.
# ---------------------------------------------------------------------------
replicaCount: 1

# Must cover the orchestrator's 60-second drain, 20-second forced-cleanup
# window, and final server shutdown. Values below 90 are rejected.
terminationGracePeriodSeconds: 90

# Orchestrator service account
serviceAccount:
  # Name of the ServiceAccount to create/use. Defaults to release name.
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Pod Security Context — PSS Restricted defaults (do not weaken).
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# Container Security Context — PSS Restricted defaults (do not weaken).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Resource limits.
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------------------------------------------------------------------------
# Probes.
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# ---------------------------------------------------------------------------
# Service (for /healthz scraping / metrics).
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  statePort: 8081

# ---------------------------------------------------------------------------
# Additional environment variables for the orchestrator container.
# ---------------------------------------------------------------------------
extraEnv: []

# ---------------------------------------------------------------------------
# Node selector, tolerations, affinity.
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Pod annotations.
# ---------------------------------------------------------------------------
podAnnotations: {}
