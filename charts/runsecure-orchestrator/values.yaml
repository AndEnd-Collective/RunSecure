# ============================================================================
# RunSecure Orchestrator — Helm values
# One release = one scope. Override this file for each scope you deploy.
# ============================================================================

# ---------------------------------------------------------------------------
# Image configuration — pin by digest for reproducibility and integrity.
# The 'digest' field takes precedence over 'tag'; both must be set when
# deploying to production (the digest is the authoritative pin).
# ---------------------------------------------------------------------------
image:
  orchestrator:
    repository: ghcr.io/andend-collective/runsecure/orchestrator
    tag: "3.0.0"
    digest: "sha256:aa28ae67b8fe13721531e9e853ba237bd895f60e1102c7417f0fdb4a5beeabb3"
    pullPolicy: Always
  proxy:
    repository: ghcr.io/andend-collective/runsecure/proxy
    tag: "3.0.0"
    digest: "sha256:5a8d1b0af811206e324252483c2682750900bab821d79ee6d97121447cba1262"
    pullPolicy: Always
  # Terminal runner images admitted by the Kubernetes backend. Each value is
  # rendered into the orchestrator environment as repository@digest; mutable
  # tags are metadata only and are never passed to a spawned Pod.
  runners:
    default:
      repository: ghcr.io/andend-collective/runsecure/node
      tag: "3.0.0-24"
      digest: "sha256:0fbf0e27d473756dac88c60615e0a3373a0c5756289ce123a784ece0d70384b6"
      pullPolicy: Always
    node:
      repository: ghcr.io/andend-collective/runsecure/node
      tag: "3.0.0-24"
      digest: "sha256:0fbf0e27d473756dac88c60615e0a3373a0c5756289ce123a784ece0d70384b6"
      pullPolicy: Always
    python:
      repository: ghcr.io/andend-collective/runsecure/python
      tag: "3.0.0-3.12"
      digest: "sha256:a7a2801a6992d7a5197c6378a20caff403c18c2e3c9a0b8932ccd6615027c891"
      pullPolicy: Always
    rust:
      repository: ghcr.io/andend-collective/runsecure/rust
      tag: "3.0.0-stable"
      digest: "sha256:a5ad55c3f5d483847dc08d68cae9b64c93f52796a187a72e19e590ce71aa9c75"
      pullPolicy: Always
  socketProxy:
    repository: ghcr.io/andend-collective/runsecure/socket-proxy
    tag: "3.0.0"
    digest: "sha256:dcde851b659aade6587cfbddafcd5d79305d22e71707412cbb65f9cccd9f9156"
    pullPolicy: Always

# ---------------------------------------------------------------------------
# Kubernetes network dependencies. API traffic can be evaluated before or
# after Service DNAT. Each API destination is an exact CIDR/port pair so a
# Service address cannot inherit an endpoint port (or vice versa). DNS requires
# both exact Service /32s and an exact namespace + Pod label selector.
# ---------------------------------------------------------------------------
kubernetesNetwork:
  apiServerPeers:
    - cidr: "10.96.0.1/32"
      port: 443
  dnsServiceCIDRs:
    - "10.96.0.10/32"
  dnsNamespace: "kube-system"
  dnsPodLabel:
    key: "k8s-app"
    value: "kube-dns"

# ---------------------------------------------------------------------------
# Scope configuration — mirrors infra/orchestrator/scopes/example.yml.
# ---------------------------------------------------------------------------
scope:
  # A short, lowercase name used for the namespace (runsecure-<name>)
  # and all runsecure.ai/* labels. Required.
  name: "default"
  description: "Default scope"

  # Backend: 'kube' (this chart) or 'compose'. Must be 'kube' for this chart.
  backend: kube

  # Host-wide ceiling across all repos in this scope.
  globalMaxRunners: 5

  # Poll cadence in seconds. Minimum 5.
  pollIntervalSeconds: 15

  # Security profile: strict | standard | permissive | custom
  securityProfile: strict

  # Which knobs a project's runner.yml is allowed to override.
  allowProjectOverrides:
    - allow_wildcards

  # Controller configuration prerequisite; the chart allows public TCP80/443
  # and DNS, without enforcing this domain list. Project proxy policy uses
  # approved runnerConfig in shared mode or runner.yml in legacy mode.
  orchEgress:
    allowDomains:
      - api.github.com

  # Repositories managed by this scope.
  repos: []
  # Example:
  # repos:
  #   - repo: owner/repo
  #     maxConcurrent: 3
  # Shared mode (set namespace on every repo; unique preprovisioned namespaces):
  #   - repo: owner/repo
  #     namespace: ci-owner-repo
  #     maxConcurrent: 3
  #     runnerConfig:
  #       runtime: node:24
  #       labels: [self-hosted, Linux, ARM64, container]
  #       resources: {memory: 2g, cpus: 2, pids: 256}
  #       httpEgress: [api.github.com]
  #       orchestrator: {timeoutSeconds: 21600}
  #     runnerImage: registry.example/terminal@sha256:<64 lowercase hex>
  #     kubernetes:
  #       nodeSelector: {dedicated: ci}
  #       tolerations: [{key: dedicated, operator: Equal, value: ci, effect: NoSchedule}]
  #       ephemeralStorage: 10Gi
  #       proxyResources: {cpu: 250m, memory: 256Mi, ephemeralStorage: 1Gi}
  # Architecture follows ARM64/X64 labels (default amd64); conflicting selectors fail.
  # Omitted runnerImage resolves the approved runtime environment image.
  # Runner and proxy requests equal limits. Defaults: runner disk10Gi;
  # proxy250m CPU/256Mi memory/1Gi disk. These settings cannot relax hardening.

# ---------------------------------------------------------------------------
# Authentication — PAT or GitHub App.
# ---------------------------------------------------------------------------
auth:
  # 'pat' or 'github_app'
  type: pat

  # --- PAT auth ---
  # Name of a pre-existing Secret with key 'pat' in the orchestrator namespace.
  # Used when auth.type == 'pat' and auth.pat.value is empty (preferred).
  pat:
    # Inline value — leave empty in production; reference an external secret instead.
    value: ""
    # Name of a pre-existing k8s Secret containing key 'pat'. If set, takes
    # precedence over auth.pat.value.
    existingSecretName: ""

  # --- GitHub App auth ---
  app:
    appId: ""
    installationId: ""
    # Name of a pre-existing Secret with key 'private-key' (PEM).
    privateKeySecretName: ""

# ---------------------------------------------------------------------------
# TLS (cert-manager). Gated: templates render only when tls.enabled=true.
# ---------------------------------------------------------------------------
tls:
  enabled: false
  # When selfSigned=true, emit a self-signed cert-manager Issuer.
  # When false, reference an existing Issuer/ClusterIssuer via issuerName.
  selfSigned: true
  # Name of the Issuer or ClusterIssuer to use when selfSigned=false.
  issuerName: ""
  # cert-manager issuer kind: Issuer or ClusterIssuer
  issuerKind: Issuer
  # Secret name for the generated TLS certificate.
  secretName: "runsecure-orchestrator-tls"
  # DNS names for the certificate.
  dnsNames: []

# ---------------------------------------------------------------------------
# Deployment configuration.
# ---------------------------------------------------------------------------
replicaCount: 1

# Must cover the orchestrator's 60-second drain, 20-second forced-cleanup
# window, and final server shutdown. Values below 90 are rejected.
terminationGracePeriodSeconds: 90

# Orchestrator service account
serviceAccount:
  # Name of the ServiceAccount to create/use. Defaults to release name.
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Pod Security Context — PSS Restricted defaults (do not weaken).
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# Container Security Context — PSS Restricted defaults (do not weaken).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Resource limits.
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------------------------------------------------------------------------
# Probes.
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# ---------------------------------------------------------------------------
# Service (for /healthz scraping / metrics).
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  statePort: 8081

# ---------------------------------------------------------------------------
# Additional environment variables for the orchestrator container.
# ---------------------------------------------------------------------------
extraEnv: []

# ---------------------------------------------------------------------------
# Node selector, tolerations, affinity.
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Pod annotations.
# ---------------------------------------------------------------------------
podAnnotations: {}

# Explicit emitting-controller identity. Downward API supplies Pod/namespace/node;
# these values describe deployment context only and contain no credentials.
logging:
  environment: Testing
  clusterName: ""
  cloud:
    provider: ""
    accountId: ""
    region: ""
    zone: ""
