# Disabled until a privately assembled, tested image, mTLS Secrets, guarded
# host reader and external archive are ready. Never put credentials here.
enabled: false
renderOnly: false
image:
  repository: ""
  digest: ""
environment: Testing
clusterName: ""
aws:
  accountId: ""
  region: ""
  logGroup: ""
  logStreamPrefix: collector
  logsEndpointIPs: []
tls:
  gatewaySecret: ""
  agentSecret: ""
dns:
  serviceCIDRs: []
  namespace: kube-system
  podLabels: {k8s-app: kube-dns}
trustedSources:
  - namespace: runsecure-eks
    container: orchestrator
    podNamePrefix: runsecure-
    signature: runsecure-orchestrator-v1
gateway:
  storageClassName: ""
  storageSize: 10Gi
  nodeSelector: {runsecure.io/pool: management}
nodeReader:
  # Phase 1 installs a Restricted namespace/admission guard; phase 2 activates
  # only the guarded namespace; after live dry-runs, phase 3 renders workloads.
  installGuardOnly: false
  # Separate guarded namespace activation keeps phase-1 failures Restricted.
  # Requires exact live guard readback; still emits no workloads when guard-only.
  activateGuardNamespace: false
  nodeSelector: {kubernetes.io/os: linux}
  tolerations:
    - {operator: Exists, effect: NoSchedule}
  journalDirectory: /var/log/journal
  # Empty collects all system units. Any filter is an explicit coverage gap.
  journalUnits: []
monitoring:
  namespace: ""
  podLabels: {}
