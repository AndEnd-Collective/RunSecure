# ============================================================================
# RunSecure — upstream registry
# ============================================================================
# Every piece of third-party software RunSecure depends on, and who is
# responsible for it. This file is the policy, not a report:
#
#   - tests/validation/test-security-status.sh fails if any Go module named in
#     any go.mod (direct or indirect) is not covered by an entry below, or if
#     a pinned component in a Dockerfile is not listed. Adding a dependency
#     from a new upstream therefore means adding it here first, on purpose.
#   - .security/STATUS.md is generated from this file plus the nightly OWASP
#     dep-scan results. When an advisory lands on a dependency, the entry
#     below is what tells a reader which upstream has to ship the fix and
#     where to follow it.
#
# What qualifies an upstream: it is maintained by a foundation, a major
# vendor or a long-established project; it publishes security advisories; and
# it is widely depended on. The `why` field records that judgement.
#
# Matching: a Go module belongs to the entry with the longest `prefix` that
# its module path starts with.
# ============================================================================

go_modules:
  - prefix: github.com/AndEnd-Collective/runsecure
    upstream: RunSecure (this repository)
    tracker: https://github.com/AndEnd-Collective/RunSecure/issues
    why: First-party code.

  # --- Go project and Google -------------------------------------------------
  - prefix: golang.org/x/
    upstream: The Go project (golang.org/x sub-repositories)
    tracker: https://github.com/golang/go/issues
    advisories: https://pkg.go.dev/vuln/
    why: Maintained by the Go team under the Go security policy.
  - prefix: google.golang.org/protobuf
    upstream: Protocol Buffers for Go (Google)
    tracker: https://github.com/golang/protobuf/issues
    why: Reference protobuf implementation for Go, maintained by Google.
  - prefix: google.golang.org/genproto
    upstream: Google API generated Go types (Google)
    tracker: https://github.com/googleapis/go-genproto/issues
    why: Generated by Google from its public API definitions.
  - prefix: github.com/google/uuid
    upstream: google/uuid (Google)
    tracker: https://github.com/google/uuid/issues
    why: De facto standard UUID package for Go.
  - prefix: github.com/google/gnostic-models
    upstream: google/gnostic-models (Google)
    tracker: https://github.com/google/gnostic-models/issues
    why: OpenAPI models used by the Kubernetes client libraries.
  - prefix: cel.dev/
    upstream: Common Expression Language (Google)
    tracker: https://github.com/google/cel-go/issues
    why: The CEL implementation Kubernetes itself uses for admission policy.

  # --- Kubernetes -------------------------------------------------------------
  - prefix: k8s.io/
    upstream: Kubernetes (CNCF)
    tracker: https://github.com/kubernetes/kubernetes/issues
    advisories: https://kubernetes.io/docs/reference/issues-security/official-cve-feed/
    why: Official Kubernetes API types and client libraries.
  - prefix: sigs.k8s.io/
    upstream: Kubernetes SIGs (CNCF)
    tracker: https://github.com/kubernetes-sigs
    why: Maintained by Kubernetes special interest groups; pulled in by client-go.

  # --- OpenTelemetry ----------------------------------------------------------
  - prefix: go.opentelemetry.io/
    upstream: OpenTelemetry (CNCF)
    tracker: https://github.com/open-telemetry/opentelemetry-collector/issues
    why: CNCF project; the collector component API the telemetry processor implements.

  # --- YAML and JSON ----------------------------------------------------------
  - prefix: gopkg.in/yaml.v3
    upstream: go-yaml
    tracker: https://github.com/go-yaml/yaml/issues
    why: The long-standing YAML library for Go.
  - prefix: go.yaml.in/yaml
    upstream: go-yaml (YAML organization fork)
    tracker: https://github.com/yaml/go-yaml/issues
    why: Maintained continuation of go-yaml, used by the Kubernetes libraries.
  - prefix: github.com/json-iterator/go
    upstream: json-iterator
    tracker: https://github.com/json-iterator/go/issues
    why: JSON codec used by Kubernetes apimachinery.
  - prefix: github.com/modern-go/
    upstream: modern-go
    tracker: https://github.com/modern-go/reflect2/issues
    why: Reflection helpers required by json-iterator.
  - prefix: github.com/fxamacker/cbor
    upstream: fxamacker/cbor
    tracker: https://github.com/fxamacker/cbor/issues
    why: CBOR codec adopted by Kubernetes apimachinery; security-audited.
  - prefix: github.com/x448/float16
    upstream: x448/float16
    tracker: https://github.com/x448/float16/issues
    why: Half-precision float support required by fxamacker/cbor.
  - prefix: gopkg.in/inf.v0
    upstream: go-inf/inf
    tracker: https://github.com/go-inf/inf/issues
    why: Arbitrary-precision decimals used by Kubernetes resource quantities.
  - prefix: gopkg.in/evanphx
    upstream: evanphx/json-patch
    tracker: https://github.com/evanphx/json-patch/issues
    why: JSON Patch implementation used by Kubernetes apimachinery.
  - prefix: github.com/santhosh-tekuri/jsonschema
    upstream: santhosh-tekuri/jsonschema
    tracker: https://github.com/santhosh-tekuri/jsonschema/issues
    why: Widely used JSON Schema validator; used only by the corner-lint developer tool.

  # --- OpenAPI ----------------------------------------------------------------
  - prefix: github.com/go-openapi/
    upstream: go-openapi
    tracker: https://github.com/go-openapi
    why: OpenAPI toolkit pulled in by Kubernetes kube-openapi.
  - prefix: github.com/emicklei/go-restful
    upstream: emicklei/go-restful
    tracker: https://github.com/emicklei/go-restful/issues
    why: REST framework referenced by Kubernetes kube-openapi.

  # --- Logging and utilities --------------------------------------------------
  - prefix: github.com/go-logr/logr
    upstream: go-logr
    tracker: https://github.com/go-logr/logr/issues
    why: Logging interface used throughout the Kubernetes libraries.
  - prefix: go.uber.org/
    upstream: Uber (zap, multierr)
    tracker: https://github.com/uber-go/zap/issues
    why: Structured logging used by the OpenTelemetry collector API.
  - prefix: github.com/davecgh/go-spew
    upstream: davecgh/go-spew
    tracker: https://github.com/davecgh/go-spew/issues
    why: Pretty-printer used by testify and Kubernetes apimachinery.
  - prefix: github.com/munnerz/goautoneg
    upstream: munnerz/goautoneg
    tracker: https://github.com/munnerz/goautoneg/issues
    why: HTTP content negotiation used by Kubernetes apimachinery.
  - prefix: github.com/hashicorp/go-version
    upstream: HashiCorp
    tracker: https://github.com/hashicorp/go-version/issues
    why: Version parsing used by the OpenTelemetry collector API.
  - prefix: github.com/cespare/xxhash
    upstream: cespare/xxhash
    tracker: https://github.com/cespare/xxhash/issues
    why: Hash function used by the OpenTelemetry libraries.
  - prefix: github.com/antlr4-go/antlr
    upstream: ANTLR
    tracker: https://github.com/antlr4-go/antlr/issues
    why: Parser runtime required by cel-go.

  # --- Testing and developer tooling (not shipped in any image) --------------
  - prefix: github.com/stretchr/testify
    upstream: stretchr/testify
    tracker: https://github.com/stretchr/testify/issues
    why: Standard Go assertion library; test-only.
  - prefix: github.com/spf13/
    upstream: spf13 (cobra, pflag)
    tracker: https://github.com/spf13/cobra/issues
    why: Standard Go CLI libraries; pflag is also used by the Kubernetes libraries.
  - prefix: github.com/inconshreveable/mousetrap
    upstream: inconshreveable/mousetrap
    tracker: https://github.com/inconshreveable/mousetrap/issues
    why: Windows helper required by cobra.
  - prefix: github.com/fatih/color
    upstream: fatih/color
    tracker: https://github.com/fatih/color/issues
    why: Terminal colours for the corner-lint developer tool.
  - prefix: github.com/mattn/
    upstream: mattn (go-colorable, go-isatty)
    tracker: https://github.com/mattn/go-isatty/issues
    why: Terminal detection required by fatih/color.
  - prefix: github.com/fsnotify/fsnotify
    upstream: fsnotify
    tracker: https://github.com/fsnotify/fsnotify/issues
    why: File watching for the corner-lint developer tool.

# Software fetched into the images by an explicit pin. `arg` names the
# Dockerfile ARG that controls the version; STATUS.md shows its current value.
pinned_components:
  - name: Debian (base operating system)
    file: images/base.Dockerfile
    from: debian
    upstream: Debian
    tracker: https://security-tracker.debian.org/tracker/
    why: Base distribution for every runner image; rebuilt with no cache so security updates land nightly.
  - name: GitHub Actions runner
    file: images/base.Dockerfile
    arg: RUNNER_VERSION
    upstream: actions/runner (GitHub)
    tracker: https://github.com/actions/runner/issues
    why: The official runner. It bundles the .NET runtime, Node.js and npm, so advisories in those arrive through a runner release.
  - name: GitHub CLI
    file: images/base.Dockerfile
    arg: GH_CLI_VERSION
    upstream: cli/cli (GitHub)
    tracker: https://github.com/cli/cli/issues
    why: The official GitHub CLI. It is a Go binary, so Go standard library and golang.org/x advisories arrive through a gh release.
  - name: npm
    file: images/base.Dockerfile
    arg: NPM_VERSION
    upstream: npm (GitHub)
    tracker: https://github.com/npm/cli/issues
    why: The official npm client, replacing the copy bundled in the runner.
  - name: undici (inside npm)
    file: images/base.Dockerfile
    arg: UNDICI_VERSION
    upstream: nodejs/undici (OpenJS Foundation)
    tracker: https://github.com/nodejs/undici/issues
    why: npm bundles undici; pinned separately so a fix can be taken before npm re-releases.
  - name: brace-expansion (inside npm)
    file: images/base.Dockerfile
    arg: BRACE_EXPANSION_VERSION
    upstream: juliangruber/brace-expansion
    tracker: https://github.com/juliangruber/brace-expansion/issues
    why: npm bundles it; pinned separately for the same reason as undici.
  - name: Node.js
    file: images/node.Dockerfile
    arg: NODE_VERSION
    upstream: Node.js (OpenJS Foundation), packaged by NodeSource
    tracker: https://github.com/nodejs/node/issues
    why: Official Node.js release line.
  - name: CPython
    file: images/python.Dockerfile
    arg: PYTHON_VERSION
    upstream: CPython (Python Software Foundation), built by astral-sh/python-build-standalone
    tracker: https://github.com/python/cpython/issues
    why: Official interpreter; the standalone build is pinned by release tag and checksum.
  - name: Rust toolchain
    file: images/rust.Dockerfile
    arg: RUST_STABLE_PIN
    upstream: The Rust project
    tracker: https://github.com/rust-lang/rust/issues
    why: Official stable toolchain; the pin moves only after both architectures certify.
  - name: Go toolchain (build stage)
    file: infra/orchestrator/Dockerfile
    arg: GO_VERSION
    upstream: The Go project
    tracker: https://github.com/golang/go/issues
    why: Official Go images; build stage only, the orchestrator ships on distroless.
  - name: Distroless base (orchestrator, socket-proxy)
    file: infra/orchestrator/Dockerfile
    from: gcr.io/distroless/static-debian12
    upstream: GoogleContainerTools/distroless (Google)
    tracker: https://github.com/GoogleContainerTools/distroless/issues
    why: Minimal static base with no shell or package manager.
  - name: Squid, HAProxy, dnsmasq (egress proxy)
    file: infra/squid/Dockerfile
    from: debian
    upstream: Debian packages of Squid, HAProxy and dnsmasq
    tracker: https://security-tracker.debian.org/tracker/
    why: Installed from Debian so they receive Debian security updates on every rebuild.
  - name: OpenTelemetry Collector Builder
    file: infra/collector/Dockerfile
    from: golang
    upstream: OpenTelemetry (CNCF)
    tracker: https://github.com/open-telemetry/opentelemetry-collector/issues
    why: Builds the telemetry collector from a pinned OCB release.
