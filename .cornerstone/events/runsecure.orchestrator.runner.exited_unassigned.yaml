apiVersion: cornerstone.cerebras.net/v1
kind: EventSignature

metadata:
  name: runsecure.orchestrator.runner.exited_unassigned
  uuid: 20578baf-f72a-4412-adc1-c5a1ce936751
  description: |
    A JIT runner container exited before GitHub reported a job assignment. A
    zero exit code is still a runtime delivery failure in this state.
  status: active
  tags: [runsecure, orchestrator, runner]

signature:
  event.signature: runsecure-orchestrator-v1
  configuration:
    time.stamp: ISO 8601
    event.format: json
    event.structure: full
    single.line: true
  required_contexts:
    - container_context
    - audit_context
